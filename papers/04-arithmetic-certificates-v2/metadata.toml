abstract = "A radix orbit is equidistributed if almost all blocks on a prescribed geometric schedule admit small mean-error rational models with growing reduced denominators on a fixed coprime prime support and a polynomial denominator cap. Partial coverage gives a quantitative discrepancy bound. Accurate models on long overlaps must agree after alignment, and a counting estimate shows that such polynomial-denominator approximations on prescribed schedules occur only finitely often for almost every real. Explicit pairs of binary streams separate odd-primary rational data and logarithmic word laws from ordinary normality, and eight obstructions isolate the information lost by specific normality-proof methods. Two uniform halting reductions show that neither normality nor nonnormality is computably enumerable on digit-program names, even when their values are transcendental and their binary discrepancy tends to zero or one; Lean checks the reductions under explicit endpoint hypotheses. A separate written Rosser argument establishes consistency-relative independence for the normality sentence of a theory-dependent digit program, with no implication for any named classical constant."
