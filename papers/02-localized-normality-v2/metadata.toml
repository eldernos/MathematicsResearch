title = "Normality of localized logarithms and polylogarithms on finite prime supports"
short_title = "Localized logarithms and polylogarithms"
version = "2.0"
status = "preprint draft"
abstract = "Let M(S) be the set of positive integers whose prime factors lie in a finite set S of primes, b >= 2 a radix and J the set of primes of S not dividing b. For s >= 1 the series sum over m in M(S) of m^{-s} b^{-m} has base-b interval discrepancy tending to 0 if J is nonempty and to 1 otherwise. For nonzero rational P, the series with numerator P(m) over all of M(S) is normal exactly when P(X)/X^s has a pole at zero and J is nonempty. Work of Captain Sude, Mira and Mira Cult covers order one for supports prime to the radix, binary supports containing 3 and two generators, and all orders for supports prime to the radix; their arguments extend further. The remaining cases use a measure-zero statement on persistent cancellation. If J is nonempty, the shifts of the series at distinct positive orders on one support, with rational numerators nonzero at zero, are jointly equidistributed in the unit cube. For p in J, a polynomial with a pole at zero and a retained subset of M(S), the discrepancy is bounded by the missed density of retained windows [p^k, 2p^k); on S = {p} normality holds exactly when infinitely many p^k are retained. For p in J, finitely many orders and a tolerance, a depth with every finite certificate below the tolerance is computable. Lean verifies the classifications and the joint theorem; written proofs and priority statements are provisional, without expert review."
keywords = ["normal numbers", "localized logarithm", "polylogarithm", "Stoneham numbers", "smooth numbers", "interval discrepancy", "joint equidistribution", "Lean 4"]
