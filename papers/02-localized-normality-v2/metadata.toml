id = "02-localized-normality-v2"
title = "Normality of localized logarithms and polylogarithms on finite prime supports"
short_title = "Localized logarithms and polylogarithms"
version = "2.0"
status = "preprint draft"
abstract = "Let M(S) be the set of positive integers whose prime factors lie in a finite set S of primes. For integers b >= 2 and s >= 1 we show that the series sum over m in M(S) of m^{-s} b^{-m} has base-b interval discrepancy tending to 0 if some prime of S does not divide b, and to 1 otherwise. For a nonzero rational polynomial P, the series with numerator P(m) is normal exactly when P(X)/X^s has a pole at zero and such a prime exists. The proof shows that persistent cancellation at an off-radix prime has measure zero, using multiplicative differences on a logarithmic circle and separation of the remaining thresholds. The shifts of these series at distinct positive orders on one fixed support, with rational numerators nonzero at zero, are jointly equidistributed in the unit cube. For retained subsets of the support we bound the discrepancy by the missed density of retained prime-power windows and classify normality on a single prime-power axis. For a fixed prime, finitely many orders and a positive tolerance, a depth at which all finite certificates fall below the tolerance is computable. The principal classifications and the joint theorem are verified by the Lean kernel. Priority statements are provisional, and no human expert has reviewed the written proofs."
keywords = ["normal numbers", "localized logarithm", "polylogarithm", "Stoneham numbers", "smooth numbers", "interval discrepancy", "joint equidistribution", "Lean 4"]
