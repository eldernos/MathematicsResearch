id = "D"
title = "Exceptional Orbits and Discrepancy of Stoneham Products"
authors = ["Christopher Anderson"]
affiliation = "Independent Researcher"
short_title = "Stoneham product orbits"
version = "1.0"
status = "preprint draft"
abstract = "For the product of two Stoneham numbers with distinct odd prime parameters, every subsequential distribution of the radix shifts is a mixture of Lebesgue measure and rational periodic orbits, and the scalar extreme interval discrepancy converges to that of the mixture. For the binary product α(2,3)α(2,5), the upper interval discrepancy is at most 4/11 + 2.85e-10, and the sharp bound 4/11 is equivalent to the upper density of integer shifted prefixes being at most 4/11; ordinary binary normality remains open. Under finite local simple-zero tests satisfied by infinitely many radices for every distinct odd prime pair, the product orbit is logarithmically equidistributed with lower discrepancy zero and at most O_ε(log* T) exceptional logarithmic scales up to T. We also consolidate the kernel-verified 43/45 bound for α(2,3)α(2,5), transcendence and strict upper discrepancy for general multiplicatively independent integer parameters, and the exact plateau-cycle discrepancy formulas and unconditional sub-quarter bounds for rational quadratics in a parameter-two Stoneham number."
