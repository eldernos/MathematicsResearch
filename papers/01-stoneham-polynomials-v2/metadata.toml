short_title = "Stoneham polynomial images"
version = "2.0"
status = "preprint draft"
abstract = """For coprime integers b ≥ 2 and c > 2, every nonconstant rational polynomial in the Stoneham number α(b,c) = Σ (1/(c^j b^(c^j))), summed over j ≥ 1, is normal in base b. Mira Cult’s October 7, 2026 public notes state a broader theorem with independent parameters. We give a kernel-verified proof for the ordinary Stoneham series. Distinct positive powers are jointly uniformly distributed. A nonintegral periodic geometric sum bounds the cancellation in rational prefixes, and Vandehey’s exponential-sum estimate gives an effective discrepancy rate. At c = 2 we determine the square’s prefix denominators. Exact finite certificates and cyclic descent prove polynomial normality in degrees 3 through 120, degree 128 and sixteen infinite families. A counting argument determines the least 2-adic valuation among the contributions of permutation orbits in every degree. Normality of the resonant quadratic α(b,2)^2 − 2α(b,2) remains open for each specified odd radix."""
