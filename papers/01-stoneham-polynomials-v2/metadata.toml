id = "01-stoneham-polynomials-v2"
title = "Polynomial Images of Stoneham Numbers"
authors = ["Christopher Anderson"]
affiliation = "Independent Researcher"
short_title = "Stoneham polynomial images"
version = "2.0"
status = "preprint draft"
abstract = """For coprime integers b ≥ 2 and c ≥ 2 let α(b,c) = Σ c^(−j) b^(−c^j), summed over j ≥ 1. Mira Cult’s public, unrefereed notes S08 (2026, Theorem 1.1 and Corollaries 1.2–1.3) show that for c > 2 every nonconstant rational polynomial in α(b,c) is normal in base b and that the distinct powers of α(b,c) are jointly normal. We give a complete kernel-verified Lean 4 proof of this ordinary case; its arithmetic step is an inclusion–exclusion argument showing that the leading prefix denominators lose only a bounded power of each prime of c. S08, Theorem 1.1(b), already gives an effective power saving with an unspecified exponent; we give the explicit scalar exponent δ_d = 1/(2(2^(d+1) − 2)) in degree d. At c = 2 and odd b ≥ 3 we determine the prefix denominators of α(b,2)^2, prove its normality, and give a denominator criterion for quadratics. A written transfer from exact finite certificates proves normality of every rational polynomial of degree 3 through 120, of degree 128, or of degree ep^r for sixteen pairs (e,p) and r ≥ 0. We determine the least 2-adic valuation of the leading mass in every degree, and show that nonvanishing of this mass on a family of open intervals of full measure would suffice in each degree. Normality of the resonant quadratic α(b,2)^2 − 2α(b,2) remains open for every odd radix b ≥ 3."""
keywords = ["Stoneham numbers", "normal numbers", "uniform distribution", "discrepancy", "p-adic valuation", "Lean 4"]
