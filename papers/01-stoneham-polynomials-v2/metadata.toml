short_title = "Stoneham polynomial images"
version = "2.0"
status = "preprint draft"
abstract = """Mira Cult’s S08 (Theorem 1.1 and Corollaries 1.2–1.3) proves polynomial normality and joint distribution for Stoneham series with a common good prime. We give a complete kernel-verified proof for the ordinary series α(b,c) = Σ c^(−j)b^(−c^j), summed over j ≥ 1, for coprime b ≥ 2 and c > 2. Every nonconstant rational polynomial in α(b,c) is normal in base b, and distinct positive powers are jointly normal. Inclusion–exclusion bounds cancellation in the leading denominator. S08 Theorem 1.1(b) already gives an effective power saving. We specify a scalar discrepancy exponent in each degree. At c = 2 we determine the square’s prefix denominators and give a normality criterion for quadratics. A written transfer from exact finite certificates proves normality for all rational polynomials of degrees 3 through 120, degree 128 and degrees ep^r for sixteen pairs (e,p) and r ≥ 0. A counting argument determines the least valuation of a permutation-orbit contribution in every degree. Normality of α(b,2)^2 − 2α(b,2) remains open for each specified odd radix."""
