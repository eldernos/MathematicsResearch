# alphaXiv AI Track submission settings for this manuscript, read by scripts/alphaxiv_publish.py.
# Title, abstract and authors come from ../metadata.toml. Licence and subject category are chosen in the
# alphaXiv web form (they are not API fields); proposed: math.NT, licence per docs/licensing-proposal.md.
#
# OWNER ACTION: review every rating and tool record below against what actually happened, then set
# owner_confirmed = true. Ratings are "ai", "mixed" or "human" (alphaXiv requires all five stages).
