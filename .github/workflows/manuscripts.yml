name: Manuscript verification
on:
  push:
    paths:
      - 'papers/**'
      - 'assets/figures/**'
      - '.github/workflows/manuscripts.yml'
  pull_request:
    paths:
      - 'papers/**'
      - 'assets/figures/**'
      - '.github/workflows/manuscripts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify the archived PDFs and independent review records
        run: python3 -B papers/check_release.py --require-reviews
      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils
      - name: Rebuild the manuscripts and resolve cross-references
        run: papers/build.sh
      - name: Read rebuilt PDFs
        run: |
          for paper in papers/[0-9][0-9]-*/paper.pdf; do
            pdfinfo "$paper"
            pdftotext "$paper" /dev/null
          done
