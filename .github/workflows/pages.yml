name: Research site
# Builds the static landing site (scripts/site.py) and deploys it with GitHub Pages.
# The owner enables it once: Settings > Pages > Build and deployment > Source: GitHub Actions.
# See docs/site.md. Until Pages is enabled the deploy job fails; the build job still checks the site.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # release tags and commit dates feed the version history
      - name: Test the site generator
        run: python3 -B scripts/test_site.py
      - name: Check the bibliography is current
        run: python3 -B scripts/site.py bib --check
      - name: Build the site
        run: python3 -B scripts/site.py build --strict --out site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
