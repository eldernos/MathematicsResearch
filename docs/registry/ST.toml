[[result]]
id = "ST-03"
title = "Exact denominator profile of the binary Stoneham square"
topic = "stoneham"
principal = true
status = "lean"
statement = '''
Let α = α(2, 3) be the sum of 1/(3ʲ 2<sup>3ʲ</sup>) over *j* ≥ 1. For an integer *n* ≥ 0 let *T*<sub>*n*</sub> be the set of ordered pairs (*i*, *j*) of positive integers with 3ⁱ + 3ʲ ≤ *n*, and put

```math
R_n = \sum_{(i,j) \in T_n} \frac{2^{\, n - 3^i - 3^j}}{3^{\, i + j}}.
```

Then 2ⁿα² − *R*<sub>*n*</sub> → 0, and the reduced denominator *q*<sub>*n*</sub> of *R*<sub>*n*</sub> is a power of 3. For every *k* ≥ 4 and 3ᵏ ≤ *n* < 3ᵏ⁺¹ its exponent is given by the following table, where each range includes its left endpoint and excludes its right endpoint.

| Digit positions *n* | Exponent of 3 in *q*<sub>*n*</sub> |
| --- | ---: |
| From 3ᵏ to 3ᵏ + 3ᵏ⁻² | 2*k* − 2 |
| From 3ᵏ + 3ᵏ⁻² to 3ᵏ + 3ᵏ⁻¹ | 2*k* − 3 |
| From 3ᵏ + 3ᵏ⁻¹ to 2 · 3ᵏ | 2*k* − 1 |
| From 2 · 3ᵏ to 3ᵏ⁺¹ | 2*k* |

For *n* < 81 the denominator *q*<sub>*n*</sub> equals 1 on [0, 6), 9 on [6, 12), 27 on [12, 18), 81 on [18, 30), 9 on [30, 36), 243 on [36, 54) and 729 on [54, 81). Consequently *q*<sub>*n*</sub> ≤ *n*² < 243 *q*<sub>*n*</sub> for every *n* ≥ 81.
'''
scope = '''
The series for α starts at *j* = 1; adding the term with *j* = 0 would create cross terms after squaring. The table requires *k* ≥ 4. The range [30, 36) on the third scale is a genuine exception: the pattern would predict 27, and the reduced denominators are 9 there (Lean checks *q*₃₀ = *q*₃₅ = 9 and *q*₃₆ = 243 separately). The profile concerns the true shifted prefix of α², summed over ordered pairs. Binary normality of α² follows from this profile by the arithmetic certificate and is also a special case of ST-01, which supersedes it.
'''
lean = [
  "NormalityChecker.StonehamSquare.exact_profile",
  "NormalityChecker.StonehamSquare.initial_profile",
  "NormalityChecker.StonehamSquare.third_scale_exception",
  "NormalityChecker.StonehamSquare.quadratic_denominator",
  "NormalityChecker.StonehamSquare.shifted_tail",
]
proof = ["notes/stoneham-square.md", "notes/stoneham-square.md#exact-ternary-cancellation"]
related = ["ST-01"]

