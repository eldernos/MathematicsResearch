[[result]]
id = "ST-10"
title = "Superlinear ternary word complexity of the binary Stoneham number"
topic = "stoneham"
status = "paper"
statement = '''
Let α = α(2, 3) be the sum of 1/(3ʲ 2<sup>3ʲ</sup>) over *j* ≥ 1. For every real *C* > 0 and every sufficiently large integer *L*, the ternary words of length *L* that start at digit positions 1, 2, …, 1 + ⌊*CL*⌋ of α are pairwise distinct. Consequently, if *p*₃(*L*) is the number of distinct words of length *L* occurring in the ternary expansion of α, then *p*₃(*L*)/*L* → ∞.
'''
scope = '''
This is a written proof, not a Lean theorem. It rests on a separation estimate for ‖*hq*α‖ with *q* = 3ᴺ or *q* = 3ᴺ − 3ᵐ, deduced from Schlickewei's *p*-adic Subspace Theorem with the places ∞, 2 and 3. The same argument covers the convention that adds the initial term 1/2. The threshold in *L* is ineffective. The result counts every word occurring at least once; it says nothing about the frequency of any ternary digit, about discrepancy below one, or about ternary normality, all of which remain open.
'''
proof = ["notes/ternary-stoneham-complexity.md"]
inputs = ["Schmidt–Schlickewei Subspace Theorem, in Schlickewei's p-adic form as stated in Y. Bilu, Astérisque 317 (2008), statement 2.3"]
related = ["ST-01"]
