[[result]]
id = "ST-01"
title = "Polynomial images of odd-prime-power Stoneham numbers"
topic = "stoneham"
principal = true
status = "lean"
statement = '''
Let *b* ≥ 2, let *p* be an odd prime with *p* ∤ *b*, and let *e* ≥ 1. Define

```math
\alpha_{b,p^e} = \sum_{j=1}^{\infty} \frac{1}{p^{ej} \, b^{p^{ej}}}.
```

For every polynomial *P* with rational coefficients and degree at least one, the number *P*(α) is normal in base *b*.
'''
scope = '''
The series starts at *j* = 1, as in Stoneham's definition. The radix *b* is the construction base. The prime must be odd: the nonvanishing argument uses *K*(*p*) ≡ 1 (mod *p* − 1), which excludes *p* = 2. No statement is made about other bases, about rational functions of α or about polynomials in several independent Stoneham numbers (see ST-04 and ST-06).
'''
lean = [
  "NormalityChecker.StonehamPolynomial.prime_power_polynomial_normal",
  "NormalityChecker.StonehamPolynomial.polynomial_normal",
  "NormalityChecker.StonehamPolynomial.power_normal",
  "NormalityChecker.StonehamPolynomial.binary_polynomial_normal",
]
proof = ["notes/stoneham-powers-products.md"]
supersedes = [
  "NormalityChecker.StonehamPolynomial.binary_power_normal",
  "NormalityChecker.StonehamSquare.binary_normal",
]
related = ["ST-02", "ST-03", "ST-04", "ST-05"]
figures = ["stoneham-square-lattice"]

[[result]]
id = "ST-02"
title = "Products of Stoneham numbers along one odd-prime axis"
topic = "stoneham"
principal = true
status = "lean"
statement = '''
Let *b* ≥ 2 and let *p* be an odd prime with *p* ∤ *b*. For positive integers *m* and *e* write

```math
\alpha(b^m, p^e) = \sum_{j=1}^{\infty} \frac{1}{p^{ej} \, b^{m p^{ej}}}.
```

For every *d* ≥ 1 and all positive integers *m*₁, …, *m*<sub>*d*</sub> and *e*₁, …, *e*<sub>*d*</sub>, the product

```math
\prod_{i=1}^{d} \alpha(b^{m_i}, p^{e_i})
```

is normal in base *b*. For example, α(2, 3) · α(2, 9) is normal in base 2.
'''
scope = '''
Every factor uses the same odd prime *p*. The radix dilations *m*ᵢ and the strides *e*ᵢ are arbitrary positive integers and may repeat, so the powers of ST-01 are the case of equal factors. Normality is asserted only in the common base *b*. The series start at *j* = 1. Products of Stoneham numbers on different primes are not covered; for α(2, 3) · α(2, 5) see ST-06 and ST-07. Sums of such products are treated in ST-04.
'''
lean = [
  "NormalityChecker.StonehamPolynomial.prime_power_product_normal",
  "NormalityChecker.StonehamPolynomial.same_prime_product_normal",
  "NormalityChecker.StonehamPolynomial.binary_three_nine_product",
]
proof = ["notes/stoneham-powers-products.md#related-parameters-and-the-limit-of-the-argument"]
related = ["ST-01", "ST-04", "ST-06"]

[[result]]
id = "ST-03"
title = "Exact denominator profile of the binary Stoneham square"
topic = "stoneham"
principal = true
status = "lean"
statement = '''
Let α = α(2, 3) be the sum of 1/(3ʲ 2<sup>3ʲ</sup>) over *j* ≥ 1. For an integer *n* ≥ 0 let *T*<sub>*n*</sub> be the set of ordered pairs (*i*, *j*) of positive integers with 3ⁱ + 3ʲ ≤ *n*, and put

```math
R_n = \sum_{(i,j) \in T_n} \frac{2^{\, n - 3^i - 3^j}}{3^{\, i + j}}.
```

Then 2ⁿα² − *R*<sub>*n*</sub> → 0, and the reduced denominator *q*<sub>*n*</sub> of *R*<sub>*n*</sub> is a power of 3. For every *k* ≥ 4 and 3ᵏ ≤ *n* < 3ᵏ⁺¹ its exponent is given by the following table, where each range includes its left endpoint and excludes its right endpoint.

| Digit positions *n* | Exponent of 3 in *q*<sub>*n*</sub> |
| --- | ---: |
| From 3ᵏ to 3ᵏ + 3ᵏ⁻² | 2*k* − 2 |
| From 3ᵏ + 3ᵏ⁻² to 3ᵏ + 3ᵏ⁻¹ | 2*k* − 3 |
| From 3ᵏ + 3ᵏ⁻¹ to 2 · 3ᵏ | 2*k* − 1 |
| From 2 · 3ᵏ to 3ᵏ⁺¹ | 2*k* |

For *n* < 81 the denominator *q*<sub>*n*</sub> equals 1 on [0, 6), 9 on [6, 12), 27 on [12, 18), 81 on [18, 30), 9 on [30, 36), 243 on [36, 54) and 729 on [54, 81). Consequently *q*<sub>*n*</sub> ≤ *n*² < 243 *q*<sub>*n*</sub> for every *n* ≥ 81.
'''
scope = '''
The series for α starts at *j* = 1; adding the term with *j* = 0 would create cross terms after squaring. The table requires *k* ≥ 4. The range [30, 36) on the third scale is a genuine exception: the pattern would predict 27, and the reduced denominators are 9 there (Lean checks *q*₃₀ = *q*₃₅ = 9 and *q*₃₆ = 243 separately). The profile concerns the true shifted prefix of α², summed over ordered pairs. Binary normality of α² follows from this profile by the arithmetic certificate and is also a special case of ST-01, which supersedes it.
'''
lean = [
  "NormalityChecker.StonehamSquare.exact_profile",
  "NormalityChecker.StonehamSquare.initial_profile",
  "NormalityChecker.StonehamSquare.third_scale_exception",
  "NormalityChecker.StonehamSquare.quadratic_denominator",
  "NormalityChecker.StonehamSquare.shifted_tail",
]
proof = ["notes/stoneham-square.md", "notes/stoneham-square.md#exact-ternary-cancellation"]
related = ["ST-01"]

[[result]]
id = "ST-04"
title = "Combinations with a unique leading monomial"
topic = "stoneham"
status = "lean"
statement = '''
Let *b*, *p* and α(*b*<sup>*m*</sup>, *p*<sup>*e*</sup>) be as in ST-02. Call a product of *d* ≥ 0 such numbers, with arbitrary positive *m* and *e* in each factor, a monomial of degree *d*; the empty product is the monomial 1 of degree 0. Let *μ* be a monomial of degree *d* ≥ 1, let *c* ≠ 0 be rational, and let *μ*₁, …, *μ*<sub>*k*</sub> be monomials of degree less than *d* with rational coefficients *a*₁, …, *a*<sub>*k*</sub>. Then

```math
c \, \mu + \sum_{i=1}^{k} a_i \, \mu_i
```

is normal in base *b*.
'''
scope = '''
The degree is the number of factors; it ignores the dilations *m* and strides *e*. The hypothesis is that exactly one monomial has maximal degree. Distinct monomials of the same maximal degree can cancel their leading residues, and no claim is made in that case. This is therefore **not** a theorem about arbitrary multivariate polynomials in Stoneham numbers. All factors share one odd prime *p* ∤ *b*, and normality is asserted only in base *b*. ST-01 and ST-02 are the special cases used in Lean.
'''
lean = [
  "NormalityChecker.StonehamPolynomial.same_prime_sum_normal",
  "NormalityChecker.StonehamPolynomial.rational_sum_normal",
  "NormalityChecker.StonehamPolynomial.integer_sum_normal",
]
proof = ["notes/stoneham-powers-products.md#related-parameters-and-the-limit-of-the-argument", "notes/stoneham-powers-products.md#the-surviving-numerator-in-every-degree"]
related = ["ST-01", "ST-02"]

