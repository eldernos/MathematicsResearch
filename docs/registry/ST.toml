[[result]]
id = "ST-07"
title = "Transcendence of products of two independent Stoneham numbers"
topic = "stoneham"
status = "paper"
statement = '''
Let *b* ≥ 2 and let *c*, *d* ≥ 2 be multiplicatively independent integers, both coprime to *b*. Write α(*b*, *c*) for the sum of 1/(*c*ʲ *b*<sup>*c*ʲ</sup>) over *j* ≥ 1. Then the product α(*b*, *c*) · α(*b*, *d*) is transcendental, and its base-*b* interval discrepancy *D*<sub>*N*</sub> (defined as in ST-06 with radix *b*) satisfies

```math
\limsup_{N \to \infty} D_N < 1.
```

In particular α(2, 3) · α(2, 5) is transcendental.
'''
scope = '''
This is a written proof, not a Lean theorem. For the parameters (*b*, *c*, *d*) = (2, 3, 5) the discrepancy bound 43/45 and irrationality are kernel-verified (ST-06); only transcendence is added here. In general no explicit bound below one is given. Transcendence uses Ridout's theorem on rational approximations whose denominators have prime factors in a fixed finite set, applied to truncations at isolated insertions. Algebraic independence of the two factors is not used or claimed, and full normality of such products remains open.
'''
proof = ["notes/stoneham-powers-products.md#a-product-on-different-prime-axes"]
inputs = ["D. Ridout, Rational approximations to algebraic numbers, Mathematika 4 (1957) — restricted-denominator form of Roth's theorem"]
related = ["ST-06"]

