The series starts at *j* = 1, as in Stoneham's definition. The radix *b* is the construction base. This odd-prime proof uses *K*(*p*) ≡ 1 (mod *p* − 1). ST-11 extends the univariate conclusion to every coprime parameter above two. ST-12 and ST-13 treat parameter two. ST-17 treats specific alternate radices, and ST-04 and ST-06 concern several factors.
'''
