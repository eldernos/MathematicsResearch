topic = "stoneham"
principal = true
status = "lean"
statement = '''
Let *b*, *p* and *e* be as in ST-01, and let *r*₁, …, *r*<sub>*d*</sub> be distinct positive integers. Then the points

```math
\left( \{ b^n \alpha^{r_1} \}, \ \ldots, \ \{ b^n \alpha^{r_d} \} \right), \qquad n = 0, 1, 2, \ldots
```

are uniformly distributed in the unit cube [0, 1)ᵈ: for every box with sides [*a*ᵢ, *c*ᵢ) ⊆ [0, 1], the proportion of the first *N* points in the box tends to its volume.
'''
scope = '''
Here α is the Stoneham number of ST-01 with parameters *b* and *p*ᵉ, and {·} is the fractional part. All coordinates use the same positions *n*. The deduction from ST-01 is the multidimensional Weyl criterion: every nonzero integer frequency vector gives a nonconstant rational polynomial in α. The theorem concerns powers of one Stoneham number, not several independent ones.
'''
lean = ["NormalityChecker.StonehamPolynomial.joint_uniform_powers"]
proof = ["notes/stoneham-powers-products.md"]
related = ["ST-01"]
