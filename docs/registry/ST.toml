[[result]]
id = "ST-06"
title = "A product on two prime axes: discrepancy below one and irrationality"
topic = "stoneham"
status = "lean"
statement = '''
For an integer *c* ≥ 2 let α(2, *c*) be the sum of 1/(*c*ʲ 2<sup>*c*ʲ</sup>) over *j* ≥ 1, and put *x* = α(2, 3) · α(2, 5). For *N* ≥ 1 let *D*<sub>*N*</sub> be the supremum, over 0 ≤ *u* < *v* ≤ 1, of the absolute difference between the proportion of 0 ≤ *n* < *N* with {2ⁿ*x*} ∈ [*u*, *v*) and *v* − *u*. Then *x* is irrational and

```math
\limsup_{N \to \infty} D_N \le \frac{43}{45}.
```
'''
scope = '''
Here {·} is the fractional part, and both series start at *j* = 1. The bound comes from a uniformly distributed share of at least 2/45 of every long prefix, supplied by one isolated insertion on each late ternary shell. Binary normality of *x* is open in this repository. Transcendence of *x* is a paper deduction from Ridout's theorem and is recorded in ST-07; it is not part of this Lean entry.
'''
lean = [
  "NormalityChecker.ProductThreeFive.discrepancy",
  "NormalityChecker.ProductThreeFive.irrational",
  "NormalityChecker.ProductThreeFive.uniform_windows",
]
proof = ["notes/stoneham-powers-products.md#a-product-on-different-prime-axes"]
