[[result]]
id = "ST-18"
title = "Power-saving discrepancy for odd-prime Stoneham polynomials"
topic = "stoneham"
status = "lean+paper"
statement = '''
Let *x* be a rational linear combination as in ST-04 with a unique nonzero monomial of largest degree *d* ≥ 1. In particular *x* may be any degree-*d* polynomial in α<sub>*b*,*p*ᵉ</sub> for an odd prime *p* ∤ *b*. There is a computable constant *C* depending on the fixed data such that for every *N* ≥ 2 the base-*b* interval discrepancy satisfies

```math
D_N(x)\le C N^{-\delta_d},
\qquad \delta_d=\frac{1}{2(2^{d+1}-2)}.
```

In degrees two and three the sharper bounds are *O*(*N*<sup>−1/6</sup>(1 + log *N*)²) and *O*(*N*<sup>−1/14</sup>(1 + log *N*)<sup>51/28</sup>).
'''
scope = '''
Lean checks the tail, denominator arithmetic, finite discrepancy transfer and dyadic summation. The explicit asymptotic rates are written deductions. The finite transfer takes the exponential-sum and Erdős–Turán estimates as hypotheses. Degree-one power savings predate this work (Kano, Bailey–Crandall). The stated nonlinear rates use a common odd prime in the defining radix.
'''
lean = [
  "NormalityChecker.QuantitativeStoneham.discrepancy_of_vandehey",
  "NormalityChecker.StonehamPolynomial.product_tail_bound",
  "NormalityChecker.QuantitativeStoneham.differencing_margin",
  "NormalityChecker.QuantitativeStoneham.dyadic_prefix_bound",
]
proof = ["notes/phase13/quantitative-normality.md"]
inputs = ["J. Vandehey, exponential sums over fixed-support denominators, Theorem 5.1 (arXiv:1606.07911), and the Erdős–Turán discrepancy inequality."]
related = ["ST-01", "ST-04"]
