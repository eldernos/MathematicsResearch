This series starts at *j* = 0, unlike α(*b*, *c*) in ST-01; thus *T*<sub>*b*,*c*,1</sub> = 1/*b* + α(*b*, *c*), and normality of α(*b*, *c*) follows by rational translation (a one-line paper step, not a separate Lean statement). The parameter *c* may be composite but must be odd; even *c* is not treated by this proof. Normality of these constants is the classical theorem of Bailey and Crandall; the entry records an independent kernel proof and claims no priority. These components are the building blocks of the finite combinations in the CR family, where sums of two such normal components can be nonnormal.
'''
