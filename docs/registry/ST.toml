title = "Polynomially spaced insertions preserve binary normality"
topic = "stoneham"
status = "lean"
statement = '''
Let *S* be the sum of 1/(3ʲ 2<sup>3ʲ</sup>) over *j* ≥ 0, and for a positive integer *r* put

```math
Z_r = \sum_{m=1}^{\infty} \frac{1}{3^{\lfloor \log_3 m \rfloor} \, 2^{m^r}}.
```

For every *r* ≥ 1 the number *S* + *Z*<sub>*r*</sub> is normal in base 2. Moreover *Z*₁ = 3 − 4*S*, so *S* + *Z*₁ = 3 − 3*S*.
'''
scope = '''
The series for *S* includes the initial term 1/2 (index *j* = 0). For *r* ≥ 2 the proof compares 3-adic norms: the Stoneham prefix dominates the perturbation prefix, so the insertions at *m*ʳ cannot cancel its denominator. For *r* = 1 there are no insertion-free blocks; instead the exact identity reduces the claim to normality of *S* (ST-08). Only base 2 and the parameter 3 are treated.
'''
lean = [
  "NormalityChecker.PolynomialInsertions.normal_of_positive_degree",
  "NormalityChecker.PolynomialInsertions.normal",
  "NormalityChecker.PolynomialInsertions.linear_value",
