[[result]]
id = "DS-07"
title = "Irrationality criterion and transcendence of signed expansions"
topic = "discrepancy"
status = "lean+paper"
statement = '''
In the setting of DS-01, the number *X* is irrational if and only if *c*ⱼ ≠ 0 for infinitely many *j*. In that case *X* is transcendental.
'''
scope = '''
The irrationality criterion is a Lean theorem. Transcendence is a paper deduction: the partial sum through insertion *j* has denominator dividing *pʲ* times the (*pʲ*)-th power of *b*, so all its prime factors divide *pb*, and it approximates *X* to within a constant times the denominator to the power −μ for every fixed μ < *p*; Ridout's theorem (μ > 1, restricted denominators) excludes algebraic irrational *X* for every *p*, and Roth's theorem suffices when *p* ≥ 3. In particular the three binary examples of DS-02, their rational translates in DS-03, and a realization of every value in the spectrum of DS-04 are transcendental. The paper argument also covers composite *p*.
'''
lean = ["NormalityChecker.SignedPhases.irrational_iff_frequently_nonzero"]
proof = ["notes/signed-shell-discrepancy.md#irrationality-lean-and-transcendence-paper-corollaries"]
inputs = "Roth's theorem on rational approximation to algebraic numbers (Roth 1955); Ridout's p-adic extension with denominators restricted to a finite set of primes (Ridout 1957)."
related = ["DS-01", "DS-04"]

