[[result]]
id = "CR-03"
title = "Two positive normal numbers with an irrational nonnormal sum, in every base"
topic = "counterexamples"
status = "lean"
statement = '''
For integers *b* ≥ 2, *c* ≥ 2 and *m* ≥ 1 put

```math
T_{c,m} = \sum_{j=0}^{\infty} \frac{1}{m \, c^j \, b^{m c^j}}.
```

Fix *b* ≥ 2 and a real number η < 1. There is a positive integer *d* with the following property. Let *l* = 2*d* + 1, let *c* be the odd part of *b*²ᵈ + 1, and put

```math
x = T_{c,1}, \qquad y = l \, T_{c,l} .
```

Then *x* and *y* are positive and normal in base *b*, their sum *x* + *y* is irrational and not normal in base *b*, and for every *r* ≥ 0 the upper limiting frequency of the length-*r* all-zero block in the base-*b* expansion of *x* + *y* exceeds η.

More generally, let *c* be odd, let 1 ≤ *m* < *l* < *c*, and suppose that *c* divides *b*ˡ⁻ᵐ + 1. Then the number

```math
m \, T_{c,m} + l \, T_{c,l}
```

is irrational and not normal in base *b*, and for every *r* ≥ 0 the upper frequency of its length-*r* all-zero block is at least (*c* − *l*)/(*c* − 1).
'''
scope = '''
Here "upper frequency of the all-zero block of length *r*" is the limit superior of the proportion of starts *n* < *N* with {*bⁿz*} ∈ [0, *b*⁻ʳ). The integer *d* is chosen once and works for every block length. Normality of each summand holds for every odd *c* ≥ 3 coprime to *b*, including composite *c*, and is proved inside the project (`weighted_radixComponent_normal`); the individual normality of Stoneham-type constants goes back to Stoneham and Bailey–Crandall. For *b* = 10, *c* = 101, *m* = 1, *l* = 3 the bound is 98/100, and `all_base_resonance` gives the fixed nonnormal sum with *m* = 1, *l* = 3 and *c* the odd part of *b*² + 1 in every base. The results do not compute the exact discrepancy of these sums, and priority of the quantitative statement is not established.
'''
lean = [
  "NormalityChecker.severe_normal_summands",
  "NormalityChecker.severe_resonance",
  "NormalityChecker.radix_pair_zero_limsup",
  "NormalityChecker.radix_pair_not_normal",
  "NormalityChecker.radix_pair_irrational",
  "NormalityChecker.all_base_resonance",
  "NormalityChecker.weighted_radixComponent_normal",
  "NormalityChecker.radixComponent_normal",
]
proof = [
  "notes/normal-summands.md",
  "notes/results.md#quantitative-nonnormality-in-every-radix",
]
supersedes = ["NormalityChecker.radix_pair_tail", "NormalityChecker.resonantSum_not_normal"]
related = ["CR-02"]

[[result]]
id = "CR-04"
title = "Exact weak limits and two different limiting distributions for one resonant sum"
topic = "resonance"
status = "lean"
statement = '''
Keep the notation of CR-01. Let *R* be the number of integers *u* with *S* ≤ *u* < *pS* for which Φ<sub>*d*</sub> divides *P*ᵤ, put *w* = *R*/((*p* − 1)*S*), and let *L* be (*p* − 1) times the product over *m* ∈ *M* of the reduced denominators of *a*ₘ/*m*. For every continuous complex-valued function *f* on the circle ℝ/ℤ, put

```math
A_N(f) = \frac{1}{N} \sum_{n=0}^{N-1} f\left( b^n L F \right).
```

Along the prefix lengths *N* = *S pᵏ*, as *k* → ∞,

```math
A_N(f) \longrightarrow (1 - w) \int_0^1 f(t) \, dt + w \, f(0).
```

For *b* = 2, *p* = 7 and *F* = *T*₁ + 2*T*₂ + 3*T*₃ one has *L* = 6, and *F* is not normal in base 2. Along *N* = 3 · 7ᵏ the atom at 0 has weight 2/9, and along *N* = 7ᵏ⁺¹ it has weight 2/3.
'''
scope = '''
The limit is the weak limit of the empirical measures of the integer-scaled orbit *b*ⁿ*LF* modulo one, not of *F* itself, and only along the geometric endpoints *S pᵏ*; different choices of *S* select different endpoint sequences, which is how the two weights in the example arise. An atom at the single point 0 of the circle does not by itself assign mass to a particular half-open digit interval, so the theorem does not give digit-block frequencies. The two weights are computed by kernel evaluation.
'''
lean = [
  "NormalityChecker.cyclotomic_distribution",
  "NormalityChecker.seventh_triple_distributions",
  "NormalityChecker.seventh_triple_masses",
  "NormalityChecker.seventh_triple_not_normal",
  "NormalityChecker.circle_mixture_of_characters",
  "NormalityChecker.cyclotomic_fourier_limit",
]
proof = [
  "notes/reviewers.md#exact-statistical-prediction",
  "notes/results.md#the-cyclotomic-checker",
]
related = ["CR-01"]

