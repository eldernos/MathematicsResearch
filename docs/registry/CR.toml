[[result]]
id = "CR-07"
title = "Every ordered partial sum of a decomposition of ln 2 is binary normal"
topic = "resonance"
status = "lean"
statement = '''
Let *T*ₘ be as in CR-02. Summing over all positive integers *m* not divisible by 3,

```math
\sum_{3 \nmid m} T_m = \ln 2 ,
```

and for every *K* ≥ 1 the finite partial sum of *T*ₘ over 1 ≤ *m* ≤ *K* with 3 ∤ *m* is normal in base 2.
'''
scope = '''
The identity regroups the series ln 2 = Σ 1/(*n* 2ⁿ) by the power of 3 dividing *n*. Normality of each partial sum follows from CR-06: after clearing powers of 3 every cell coefficient is a sum of odd numerators over the indices, and the unique largest power of 2 among the indices prevents cancellation. Convergence of the partial sums to ln 2 gives no control of digit frequencies, and nothing here proves or disproves binary normality of ln 2. The scaled error (*K* + 1) 2ᴷ (ln 2 − *F*ᴷ) and the resulting open uniformity problem are discussed in notes/ordered-tail.md.
'''
lean = [
  "NormalityChecker.ordered_sum_binary_normal",
  "NormalityChecker.hasSum_components_logTwo",
  "NormalityChecker.ordered_phase_ne_zero",
]
proof = [
  "notes/finite-sums.md#consequences-and-scope",
  "notes/results.md#which-digit-questions-the-proofs-settle",
]
related = ["CR-06"]
