# Cyclotomic resonance and finite combinations. Manuscript: papers/03-signed-resonance.
# Format: docs/registry/SCHEMA.md

[[result]]
id = "CR-01"
title = "Cyclotomic classification of finite combinations of Stoneham-type components"
topic = "resonance"
principal = true
status = "lean"
statement = '''
Let *b* ≥ 2, let *p* be an odd prime with *p* ∤ *b*, and let *d* be the multiplicative order of *b* modulo *p*. For each positive integer *m* put

```math
T_m = \sum_{j=0}^{\infty} \frac{1}{m \, p^j \, b^{m p^j}}.
```

Let *M* be a finite set of positive integers, let *a*ₘ (*m* ∈ *M*) be rational numbers, and let *S* be a positive integer with *m* ≤ *S* for every *m* ∈ *M*. For each integer *u* with *S* ≤ *u* < *pS* and each *m* ∈ *M*, let *j*ₘ(*u*) be the largest *j* ≥ 0 with *m p*ʲ ≤ *u*, and form the rational polynomial

```math
P_u(X) = \sum_{m \in M} \frac{a_m}{m \, p^{j_m(u)}} \, X^m .
```

Then *F* = Σ *a*ₘ *T*ₘ is normal in base *b* if and only if the *d*-th cyclotomic polynomial Φ<sub>*d*</sub> divides none of the polynomials *P*ᵤ with *S* ≤ *u* < *pS*.
'''
scope = '''
Normality means that every word of every length *k* ≥ 1 occurs among the overlapping base-*b* blocks with limiting frequency *b*⁻ᵏ, using half-open digit cylinders. The coefficients may be negative or zero and the indices may be divisible by *p*. If *M* is empty or all coefficients vanish, every *P*ᵤ is the zero polynomial, so the criterion correctly reports that *F* = 0 is not normal. Every admissible *S* gives the same answer. The prime *p* must be odd; *p* = 2 and composite parameters are not covered. The theorem concerns base *b* only and finite families only; it says nothing about the infinite decomposition of ln 2 (see CR-07). The executable Boolean `cyclotomicNormalTest`, which takes *S* = max(1, max *M*) and decides divisibility by exact rational cyclic-vector arithmetic, is proved correct on exactly this parameter domain.
'''
lean = [
  "NormalityChecker.cyclotomic_normal_iff",
  "NormalityChecker.cyclotomicNormalTest_correct",
  "NormalityChecker.resonanceWitnesses_eq",
  "NormalityChecker.CyclicPolynomial.vanishes_iff",
]
proof = [
  "notes/reviewers.md#finite-combinations-of-stoneham-type-components",
  "notes/results.md#the-cyclotomic-checker",
]
related = ["CR-04", "CR-05", "CR-06", "CR-07"]

[[result]]
id = "CR-02"
title = "Exactly two rational coefficients make a binary two-term sum nonnormal"
topic = "resonance"
status = "lean"
statement = '''
For each positive integer *m* put

```math
T_m = \sum_{j=0}^{\infty} \frac{1}{m \, 3^j \, 2^{m 3^j}}.
```

For every rational number *a*, the number *T*₁ + *a T*₂ is normal in base 2 if and only if *a* ≠ 2 and *a* ≠ 2/3.
'''
scope = '''
The series start at *j* = 0, so *T*₁ = 1/2 + α, where α is the binary Stoneham number with parameter 3 in the convention of ST-01 (series from *j* = 1). Only rational *a* and only base 2 are covered; *a* = 0 and negative *a* are included. For *a* = 2 Lean also proves that, for every *r* ≥ 0, the upper frequency of the all-zero block of length *r* in *T*₁ + 2*T*₂ is at least 1/2 (`binary_zero_block_limsup`). The equivalence is the two-cell special case of CR-06.
'''
