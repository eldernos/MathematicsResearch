[[result]]
id = "CR-06"
title = "A finite rational test for binary combinations with parameter 3"
topic = "resonance"
status = "lean"
statement = '''
Let *T*ₘ be as in CR-02, let *M* be a finite set of positive integers, let *a*ₘ be rational, and let *S* be a positive integer with *m* ≤ *S* for every *m* ∈ *M*. For *S* ≤ *u* < 3*S* let *j*ₘ(*u*) be the largest *j* ≥ 0 with *m* 3ʲ ≤ *u*, and put

```math
H_u = \sum_{m \in M} \frac{a_m \, (-1)^m}{m \, 3^{j_m(u)}} .
```

Then *F* = Σ *a*ₘ *T*ₘ is normal in base 2 if and only if *H*ᵤ ≠ 0 for every *u* with *S* ≤ *u* < 3*S*. In particular each *T*ₘ is binary normal, and *T*₂₀ + *T*₂₈ + *T*₃₅ is not binary normal (the cell *u* = 84 fails).
'''
scope = '''
This is the case *b* = 2, *p* = 3 of CR-01: there Φ₂(*X*) = *X* + 1 and *H*ᵤ = *P*ᵤ(−1), and Lean proves that the two executable tests agree on every admissible input (`cyclotomicTest_binary_eq`). Negative and zero coefficients and indices divisible by 3 are allowed. The constants in the proof depend on the finite family, so the test gives no uniform control as the family grows.
'''
lean = [
