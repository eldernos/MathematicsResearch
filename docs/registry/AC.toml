[[result]]
id = "AC-07"
title = "Discrepancy bounds from certified paths between prefix endpoints"
topic = "coverage"
status = "lean"
statement = '''
Let *b* ≥ 2, *x* real and *N* > 0. For an interval [α, β) ⊆ [0, 1] let *S*(*v*) be the number of *n* < *v* with α ≤ {*bⁿx*} < β, minus *v*(β − α). Suppose that for every such interval there are integers 0 = *v*₀, *v*₁, …, *v*ₘ = *N* and costs *c*₀, …, *c*ₘ₋₁ with |*S*(*v*ᵢ₊₁) − *S*(*v*ᵢ)| ≤ *c*ᵢ and *c*₀ + ⋯ + *c*ₘ₋₁ ≤ *DN*. Then *D*<sub>*N*</sub>(*x*) ≤ *D*.
'''
scope = '''
The path may depend on the tested interval, may traverse a certified edge backwards, may overshoot *N* and return, and may repeat vertices. Restricting a certified interval to a subinterval costs the two discarded lengths, and disjoint certified pieces cost the sum of their bounds plus one per uncovered position. Clipping is not free: counting overlapping certified intervals twice can give an incorrect bound.
'''
lean = [
  "NormalityChecker.Coverage.discrepancy_of_paths",
  "NormalityChecker.Coverage.endpoint_path",
  "NormalityChecker.Coverage.fourier_of_path",
  "NormalityChecker.Coverage.restrict_edge",
  "NormalityChecker.Coverage.disjoint_cover",
]
