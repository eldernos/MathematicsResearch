[[result]]
id = "AC-05"
title = "Exact rational discrepancy certificates for prime-restricted logarithmic series"
topic = "certificates"
status = "lean"
statement = '''
Let *b* ≥ 2 and *s* ≥ 1, let *P* be a finite set of primes, and let

```math
X = \sum_{m} \frac{1}{m^s \, b^m},
```

the sum over all positive integers *m* whose prime factors lie in *P* (including *m* = 1). Let *p* ∈ *P* with *p* ∤ *b* and let ℓ ≥ 0. Let *Z* be the set of failed cells, the integers *u* with *pˡ* ≤ *u* < *pˡ*⁺¹ at which the executable residue test of precision ℓ vanishes, and for real *v* let *z*(*v*) be the number of failed cells *u* < *v*. Then

```math
D_\infty(X) \le \max_{p^\ell \le v \le p^{\ell+1}} \frac{|Z|/(p-1) + z(v)}{v}.
```

For *b* = 7, *P* = {2, 3, 5} and *p* = 5 the right side equals 5/12, 1/4 and 0 at ℓ = 0, 1, 2. If for every ε > 0 some precision ℓ has at most ε*pˡ* failed cells, then *X* is normal in base *b*. Without any computation, *D*∞(*X*) ≤ 1 − 1/(*p* − 1).
'''
scope = '''
The bound charges every failed cell fully at every prefix end, including cutoffs inside a scale; the maximum over *v* accounts for prefixes ending partway through a scale. A passing cell certifies growth of the reduced prefix denominator at the actual digit positions, and AC-04 then gives uniform distribution on those blocks. The base-7 values are kernel evaluations; this example is also normal by the selected prime 2 (take *p* = 2, where the universal bound is 0). The certificate is an upper bound and need not be sharp; the exact single-prime formula is a separate result in notes/persistent-discrepancy.md.
'''
lean = [
  "NormalityChecker.LocalizedSupport.discrepancy_le_certificate",
  "NormalityChecker.LocalizedSupport.discrepancy_of_cell_cover",
  "NormalityChecker.LocalizedSupport.base_seven_certificate_values",
  "NormalityChecker.LocalizedSupport.normal_of_shrinking_cells",
  "NormalityChecker.LocalizedSupport.discrepancy_le_of_support_prime",
  "NormalityChecker.LocalizedSupport.failed_cell_refines",
  "NormalityChecker.LocalizedSupport.passing_cell_survives",
]
proof = [
  "notes/finite-support-discrepancy.md#partial-certificates-and-unfinished-scales",
  "notes/results.md#quantitative-discrepancy-on-finite-prime-supports",
]
computation = ["scripts/localized_certificate.py"]
related = ["AC-04", "AC-06"]

[[result]]
id = "AC-06"
title = "Charging only simultaneous failures of several prime tests"
topic = "certificates"
status = "lean"
statement = '''
In the setting of AC-05, let *J* be a nonempty set of primes of *P* none of which divides *b*, each with its own precision. Write *B*ₚ for the set of positions *n* whose cell coordinate fails the test for *p*. If for every ε > 0 and all sufficiently large *N* the number of *n* < *N* lying in every *B*ₚ, *p* ∈ *J*, is at most (*D* + ε)*N*, then *D*∞(*X*) ≤ *D*.

For *b* = 2, *s* = 1 and *P* = {2, 5, 13}, the two first-precision tests at 5 and 13 fail on [2 · 5ʲ, 4 · 5ʲ) and [10 · 13ᵏ, 13ᵏ⁺¹) and fail simultaneously on at most 0.234*N* + 2197 of the first *N* positions, for every *N*. Hence *D*∞(*X*) ≤ 0.234.
'''
scope = '''
No independence between the tests is assumed. The number *X* for {2, 5, 13} is in fact binary normal, since either prime proves normality at precision two (`five_thirteen_binary_normal`); the bound 0.234 measures what the joint first-precision information alone yields. The sharper enclosure 0.233241755… of the joint upper density is an exact rational computation with a paper argument, not a Lean theorem. A paper argument shows that joint failure counts of two tests cannot prove normality while both tests keep positive limiting mass.
'''
lean = [
  "NormalityChecker.LocalizedSupport.discrepancy_of_joint_failures",
  "NormalityChecker.LocalizedSupport.first_precision_joint_discrepancy",
