[[result]]
id = "AC-10"
title = "Accurate polynomial-denominator models are rare on a fixed schedule"
topic = "counterexamples"
status = "lean+paper"
statement = '''
Fix *b* ≥ 2, *d* ≥ 0, *B* ≥ 2 and *L* ≥ 2, and consider the blocks of length *T* = *Bᵏ* at the starts used in AC-01. For Lebesgue-almost every *x* in [0, 1), only finitely many of these blocks admit a rational *y* with denominator at most *Tᵈ* and, with ‖·‖ the distance to the nearest integer,

```math
\frac{1}{T} \sum_{i=0}^{T-1} \left\| b^{n+i} x - b^i y \right\| \le \frac{1}{16 \, b^4} .
```
'''
scope = '''
Lean verifies the finite counting inequality: among words of length *j* over an alphabet of size *a*, those with at most *k* occurrences of a fixed letter number at most (2*a* − 1)ʲ/2ʲ⁻ᵏ. The probabilistic deduction is on paper: for a fixed model, a uniform *x* makes the block an independent uniform digit string in base *b*², the counting inequality bounds the chance of a small mean error by an exponentially small quantity, there are polynomially many models and *O*(*Lᵏ*) starts per scale, and the first Borel–Cantelli lemma finishes. The statement concerns prescribed schedules and Lebesgue measure; it singles out no particular constant and does not show that any specific number lacks a certificate.
'''
lean = ["NormalityChecker.few_symbol_words"]
proof = ["notes/finite-support-discrepancy.md#how-far-polynomial-denominator-models-can-reach"]
inputs = "First Borel–Cantelli lemma (standard measure theory)."
