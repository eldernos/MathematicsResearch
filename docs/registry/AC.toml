# and D_N, D∞ are the interval discrepancies of the radix orbit as in DS-01.

[[result]]
id = "AC-01"
title = "Normality from rational orbit models on most blocks"
topic = "certificates"
principal = true
status = "lean"
statement = '''
Let *b* ≥ 2 and let *c* ≥ 2 be an integer coprime to *b*. Let *x* be real and let *P*₀, *P*₁, … be rational numbers with *bⁿx* − *P*ₙ → 0. Fix integers *B* ≥ 1, *L* ≥ 2 and *d* ≥ 0. At scale *k*, for each integer *u* with 1 ≤ *u* < *LB* and each 0 ≤ *l* < *Lᵏ*, consider the block of *T* = *Bᵏ* positions starting at *n* = (*u Lᵏ* + *l*) *Bᵏ*. Suppose that for every such *u*, every integer *M* and every η > 0, for all sufficiently large *k* there is an exceptional set of at most η*Lᵏ* indices *l* such that every other block admits a rational number *y* whose reduced denominator *q* satisfies

* *q* ≥ *M*,
* every prime factor of *q* divides *c*,
* *q* ≤ *Tᵈ*,

and

```math
\sum_{i=0}^{T-1} \left\| P_{n+i} - b^i y \right\| \le \eta \, T ,
```

where ‖·‖ is the distance to the nearest integer. Then *x* is normal in base *b*.
'''
scope = '''
Each block may use its own model *y*. The exact-orbit version, with *y* = *P*ₙ and *P*ₙ₊ᵢ = *bⁱP*ₙ on good blocks, is `normal_of_arithmetic_certificate`. The Lean theorem takes the fixed-support short-orbit estimate for (*b*, *c*) as a hypothesis; AC-04 proves that estimate for every *c* ≥ 2 coprime to *b*, and the two compose directly (as in `DominatedPerturbation.lean`). The denominator exponent *d* and the integer *c* are fixed across all scales and cutoffs. The result gives no rate; a finite interval-count bound for the same block data is `approximate_interval_count_bound`. AC-10 shows that fixed-accuracy models of this kind exist only for a Lebesgue-null set of *x* on a prescribed schedule, so the hypotheses hold only for a Lebesgue-null set of *x*.
'''
lean = [
  "NormalityChecker.normal_of_approximate_arithmetic_certificate",
  "NormalityChecker.normal_of_arithmetic_certificate",
  "NormalityChecker.fixed_support_orbit_estimate",
  "NormalityChecker.approximate_prefix_bound",
  "NormalityChecker.phase_model_sum_bound",
  "NormalityChecker.approximate_interval_count_bound",
]
proof = [
  "notes/polynomial-certificates.md#approximate-blocks-and-quantitative-control",
  "notes/results.md#normality-from-rational-prefixes",
]
related = ["AC-04", "AC-10"]

[[result]]
id = "AC-02"
title = "Partial coverage bounds the discrepancy"
topic = "coverage"
principal = true
status = "lean"
statement = '''
Let *b* ≥ 2 and *x* be real, and write *u*ₙ = {*bⁿx*}. Let *N* > 0 and let *G*₁, …, *G*ₖ be pairwise disjoint subsets of {0, …, *N* − 1} with union of size *G*. Suppose that, for some real *d* and every interval [α, β) ⊆ [0, 1] and every *i*,

```math
\left| \#\{ n \in G_i : \alpha \le u_n < \beta \} - (\beta - \alpha) \, |G_i| \right| \le d \, |G_i| .
```

Then *D*<sub>*N*</sub>(*x*) ≤ 1 − (1 − *d*) *G*/*N*. If *d* ≤ 1 and for every ε > 0 every sufficiently long prefix admits such pieces covering a proportion at least *g* − ε, then *D*∞(*x*) ≤ 1 − *g*(1 − *d*).

In particular, if a family of selected sets covering a lower proportion *g* is asymptotically uniformly distributed relative to the full prefix length, then *D*∞(*x*) ≤ 1 − *g*; and if each of the *q* intervals [*j*/*q*, (*j* + 1)/*q*) has limiting frequency 1/*q*, then *D*∞(*x*) ≤ 2/*q*. Taking *q* = 2⁸, correct limiting frequencies of all 256 binary words of length 8 give *D*∞(*x*) ≤ 1/128.
'''
scope = '''
The pieces may be chosen afresh for each prefix and may come from different rational models or starting indices. A piece cut by the prefix end must either carry its own certificate or be charged as uncovered. These are general facts about arbitrary radix orbits; they do not by themselves supply the covering share for any particular constant. For ln 2, *d* = 1/3 and *g* = 3/20000 would give *D*∞ ≤ 0.9999, and that coverage is open (see CC-04).
'''
lean = [
  "NormalityChecker.Coverage.fixed_quality_cover",
  "NormalityChecker.Coverage.asymptotic_fixed_quality",
  "NormalityChecker.discrepancy_of_uniform_share",
  "NormalityChecker.discrepancy_of_fixed_cells",
]
proof = [
  "notes/intermittent-coverage.md#fixed-quality-and-unfinished-blocks",
  "notes/results.md#quantitative-discrepancy-on-finite-prime-supports",
]
related = ["AC-07", "CC-04"]

[[result]]
id = "AC-03"
title = "Rigidity of overlapping smooth rational models"
topic = "coverage"
principal = true
status = "lean"
statement = '''
Let *b*, *c* ≥ 2 be coprime and let *d* ≥ 0. There is δ > 0 with the following property. Let *T* ≥ 1, let *x* and *y* be rationals whose reduced denominators are at most *Tᵈ* and have all prime factors dividing *c*, and suppose *x* − *y* is not an integer. Then for all real numbers *f*₀, *f*₁, …, with ‖·‖ the distance to the nearest integer,

```math
\frac{1}{T} \sum_{i=0}^{T-1} \left( \left\| f_i - b^i x \right\| + \left\| f_i - b^i y \right\| \right) \ge \delta .
```

Consequently, if two such families of models *xₙ*, *yₙ* on common blocks of lengths *Tₙ* have mean total error tending to 0, then *xₙ* − *yₙ* is an integer for all large *n*; and along a chain of overlaps in which successive models agree modulo one after shifting, the reduced denominators are eventually constant.
'''
scope = '''
δ depends only on *b*, *c* and *d*. The denominator bound must be polynomial in the actual overlap length *T*: the models 0 and *c* to the power −*T*² have vanishing separation, and the models 0 and 1/*b* agree after one shift. The chain statement shows that compatible overlaps cannot supply the growing denominators required by AC-01; short overlaps and disjoint blocks are not excluded.
'''
lean = [
  "NormalityChecker.smooth_overlap_rigidity",
  "NormalityChecker.smooth_overlap_separation",
  "NormalityChecker.overlap_chain_denominator",
]
proof = ["notes/overlapping-certificates.md#rigidity-on-shared-samples"]
related = ["AC-01", "AC-04"]

[[result]]
id = "AC-04"
title = "Cancellation in short radix orbits with smooth denominators"
topic = "certificates"
status = "lean"
statement = '''
Let *b*, *c* ≥ 2 be coprime integers and let *d* ≥ 0. For every η > 0 there is an integer *M* such that for every rational *y* and every integer *T* ≥ 0, if the reduced denominator *q* of *y* satisfies *q* ≥ *M*, *q* divides a power of *c*, and *q* ≤ *Tᵈ*, then

```math
\left| \sum_{i=0}^{T-1} e\left( b^i y \right) \right| \le \eta \, T .
```
'''
scope = '''
The estimate is uniform in the numerator of *y*, in *T*, and in the exponents of the individual primes of *c*. It is qualitative: the Lean proof by repeated differencing gives no explicit saving, and Vandehey's quantitative Corollary 1.2, which covers this range, is not formalized. The orbit length need not be a full period of *b* modulo *q*.
'''
lean = ["NormalityChecker.fixed_support_orbit_estimate"]
proof = ["notes/arithmetic-certificates.md#the-fixed-prime-set-estimate"]
