# Localized logarithms and polylogarithms. Manuscript: papers/02-localized-normality.
# Format: docs/registry/SCHEMA.md
#
# Coordination notes.
# - The finite certificate examples (decimal_235_normal, decimal_2511_normal, base30_2357_normal,
#   decimal_257_normal, binary_certificates, Certificate.normal, the joint {2,5,13} bound in
#   JointFiveThirteen) are left to the AC family. All of their normality conclusions are special
#   cases of LS-01.
# - LS-02 is a principal result by editorial choice. For the unsigned full supports it concerns,
#   LS-03 makes every persistent region null, so the value of the formula is already determined
#   by LS-01 (0 with an off-base prime, 1 otherwise). The scope says so explicitly.

[[result]]
id = "LS-01"
title = "Unsigned finite-support dichotomy"
topic = "localized"
principal = true
status = "lean"
statement = '''
Let *b* ≥ 2 and *s* ≥ 1 be integers, let *P* be a finite set of primes, and let *M*(*P*) be the set of positive integers all of whose prime factors lie in *P*, including 1. Put

```math
X = \sum_{m \in M(P)} \frac{1}{m^s \, b^m}.
```

For *N* ≥ 1 let *D*<sub>*N*</sub> be the supremum, over 0 ≤ *u* < *v* ≤ 1, of the absolute difference between the proportion of 0 ≤ *n* < *N* with {*b*ⁿ*X*} ∈ [*u*, *v*) and *v* − *u*. Then:

- if some *p* ∈ *P* does not divide *b*, then *D*<sub>*N*</sub> → 0, so *X* is normal in base *b*;
- if every *p* ∈ *P* divides *b*, then *D*<sub>*N*</sub> → 1.
'''
scope = '''
The limits are along all integer cutoffs *N*, not only a subsequence. Every positive order *s* is allowed, and the support may share any primes with *b*. The empty set *P* falls in the second case: then *X* = 1/*b* and *D*<sub>*N*</sub> → 1. Normality is asserted only in the defining radix *b*. The proof gives no rate and no uniformity as *P* grows; the unrestricted series for log 2, whose support contains every prime, is not covered. The normality half uses the soundness of the computable certificate together with LS-03; it does not use the maximum formula of LS-02.
'''
lean = [
  "NormalityChecker.LocalizedSupport.unsigned_discrepancy_limit",
  "NormalityChecker.LocalizedSupport.unsigned_finite_support_normal",
  "NormalityChecker.LocalizedSupport.maximal_discrepancy_iff",
  "NormalityChecker.LocalizedSupport.prefix_discrepancy_tendsTo_one",
]
proof = ["notes/unsigned-finite-support.md"]
supersedes = [
  "NormalityChecker.LocalizedSupport.maximal_of_base_primes",
  "NormalityChecker.LocalizedSupport.normal_of_two_mem",
]
related = ["LS-02", "LS-03", "LS-04", "MW-01"]

[[result]]
id = "LS-02"
title = "Exact discrepancy from persistent cancellation at every order"
topic = "localized"
principal = true
status = "lean"
statement = '''
Let *b*, *s*, *P*, *M*(*P*), *X* and *D*<sub>*N*</sub> be as in LS-01, and let *J* be the set of *p* ∈ *P* with *p* ∤ *b*. For *p* ∈ *J* let *w* be the root of unity in the *p*-adic integers congruent to 1/*b* modulo *p*, and put *S*<sub>*p*</sub> = *M*(*P* ∖ {*p*}). For 1 ≤ *d* ≤ *s* and 1 ≤ *t* < *p* define the convergent *p*-adic series

```math
V_{p,d}(t) = \sum_{i=0}^{\infty} p^{di} \sum_{r \in S_p, \ r \le p^i t} \frac{w^r}{r^d},
```

and let *Z*<sub>*p*,*d*</sub> be the set of 1 ≤ *t* < *p* with *V*<sub>*p*,*d*</sub>(*t*) = 0. For *y* ≥ 1 write *t*<sub>*p*</sub>(*y*) = *y* / *p*^⌊log<sub>*p*</sub> *y*⌋, and let *B* be the set of *y* ≥ 1 with *t*<sub>*p*</sub>(*y*) ∈ *Z*<sub>*p*,*d*</sub> for every *p* ∈ *J* and every 1 ≤ *d* ≤ *s*. With |·| denoting Lebesgue measure,

```math
D_N - \frac{|B \cap [0, N)|}{N} \to 0 \qquad (N \to \infty).
```

Moreover the upper limit is a maximum over a compact phase set. Let *W*<sub>*p*</sub> be the union over all integers *j* of the dilates *p*ʲ(*Z*<sub>*p*,1</sub> ∩ … ∩ *Z*<sub>*p*,*s*</sub>). For *T* = (*T*<sub>*p*</sub>) with 1 ≤ *T*<sub>*p*</sub> ≤ *p*, let *Q*(*T*) be the measure of the set of *u* ∈ [0, 1) with *uT*<sub>*p*</sub> ∈ *W*<sub>*p*</sub> for every *p* ∈ *J*. Let *H* be the closure, in the torus with one circle ℝ/ℤ for each *p* ∈ *J*, of the curve *t* ↦ (*t* / log *p* mod 1). Then lim sup *D*<sub>*N*</sub> is the largest value of *Q*(*T*) over all *T* whose angles (log *T*<sub>*p*</sub> / log *p* mod 1) lie in *H*, and this largest value is attained.

In the special case *s* = 1 with exactly one prime *p* ∈ *P* not dividing *b*, writing *Z* = *Z*<sub>*p*,1</sub>,

```math
\limsup_{N \to \infty} D_N = \max_{1 \le t \le p} \frac{|Z|/(p-1) + |Z \cap [1, t)|}{t},
```

and *X* is normal in base *b* if and only if |*Z*| = 0.
'''
scope = '''
*Z*<sub>*p*,*d*</sub> is exactly the set where the repository's executable order-*d* residue test for *p* fails at every precision (HigherOrderCells). Lean also proves the finite-checker form: if *F*<sub>*L*</sub>(*N*) counts the 0 ≤ *n* < *N* whose cell ⌊*p*<sup>*L*−1</sup> *t*<sub>*p*</sub>(*n*)⌋ fails at precision *L* for every pair (*p*, *d*), then lim over *L* of lim sup over *N* of *F*<sub>*L*</sub>(*N*)/*N* equals lim sup *D*<sub>*N*</sub>. Lean indexes the precision *L* by *l* = *L* − 1. All statements include empty *P* and empty *J* (then *B* = [1, ∞) and *D*<sub>*N*</sub> → 1). The formulas concern only the unsigned full-support series *X*. By LS-03 every *Z*<sub>*p*,*d*</sub> with *p* ∈ *J* is null, so for these series every quantity above equals 0 whenever *J* is nonempty; the value of the formula is therefore already given by LS-01. The entry records the exact identification of discrepancy with persistent cancellation, including convergence of the computable bounds. No analogue is claimed here for signed or masked weights.
'''
lean = [
  "NormalityChecker.LocalizedSupport.jointOrder_density_tendsTo_discrepancy",
  "NormalityChecker.LocalizedSupport.discrepancy_eq_log_flow_max",
  "NormalityChecker.LocalizedSupport.discrepancy_tracks_jointPhase",
  "NormalityChecker.LocalizedSupport.persistent_iff_phaseMoment_zero",
  "NormalityChecker.LocalizedSupport.discrepancy_eq_persistent_max",
  "NormalityChecker.LocalizedSupport.normal_iff_persistent_null",
  "NormalityChecker.LocalizedSupport.certificate_tendsTo_discrepancy",
]
proof = [
  "notes/higher-order-joint.md",
  "notes/higher-order-joint.md#maximum-on-the-compact-log-flow",
  "notes/persistent-discrepancy.md#the-exact-formula",
]
supersedes = [
  "NormalityChecker.LocalizedSupport.joint_density_tendsTo_discrepancy",
  "NormalityChecker.LocalizedSupport.normal_iff_joint_density_zero",
]
related = ["LS-01", "LS-03", "LS-08"]

[[result]]
id = "LS-03"
title = "Persistent failed regions are null"
topic = "localized"
principal = true
status = "lean"
statement = '''
Let *b*, *s*, *P* and *X* be as in LS-01, and let *p* ∈ *P* with *p* ∤ *b*. With *V*<sub>*p*,*s*</sub> as in LS-02, the set *Z*<sub>*p*,*s*</sub> = {1 ≤ *t* < *p* : *V*<sub>*p*,*s*</sub>(*t*) = 0} has Lebesgue measure zero.

Consequently the computable certificate tends to zero. For *k* ≥ 0 let *F*<sub>*k*</sub> be the set of integers *u* with *p*ᵏ ≤ *u* < *p*ᵏ⁺¹ such that *V*<sub>*p*,*s*</sub>(*u*/*p*ᵏ) ≡ 0 modulo *p*ᵏ⁺¹, and put

```math
C_k = \max_{p^k \le v \le p^{k+1}} \frac{|F_k|/(p-1) + \#\{u \in F_k : u < v\}}{v}.
```

Then lim sup *D*<sub>*N*</sub> ≤ *C*<sub>*k*</sub> for every *k*, and *C*<sub>*k*</sub> → 0 as *k* → ∞.
'''
scope = '''
The nullity holds separately for each prime *p* ∈ *P* with *p* ∤ *b* and each order *s* ≥ 1, whatever the other primes of *P*. The residue condition defining *F*<sub>*k*</sub> is exactly the executable cell test at precision *k* + 1. The certificate tends to zero but may be positive at every finite depth: **finite termination is not claimed** (see LS-06 and LS-07 for paper results in special cases). The proof uses recurrence on the logarithmic circle, multiplicative finite differences in the cofactors and *p*-adic separation of finitely many geometric rays; it needs no independence of the reciprocal logarithms.
'''
lean = [
  "NormalityChecker.LocalizedSupport.unsigned_persistent_null",
  "NormalityChecker.LocalizedSupport.unsigned_certificate_tendsTo_zero",
  "NormalityChecker.LocalizedSupport.discrepancy_le_certificate",
]
proof = [
  "notes/unsigned-finite-support.md#from-prime-residues-to-a-measurable-function",
  "notes/unsigned-finite-support.md#why-a-positive-measure-zero-set-is-impossible",
]
related = ["LS-01", "LS-02", "LS-06", "LS-07"]

[[result]]
id = "LS-04"
title = "Two-generator localized logarithms: normality with a discrepancy rate"
topic = "localized"
status = "lean"
statement = '''
Let *b*, *q* ≥ 2 be integers with *q* ∣ *b*, and let *p* be an odd prime with *p* ∤ *b*. Put

```math
X = \sum_{a=0}^{\infty} \sum_{j=0}^{\infty} \frac{1}{q^a p^j \, b^{q^a p^j}}.
```

Then *X* is normal in base *b*, and there is a constant *A* > 0 such that, with *D*<sub>*N*</sub> as in LS-01,

```math
D_N \le \frac{A}{\log \log N}
```

for all sufficiently large *N*. In particular the series for log 2 restricted to the integers with prime factors in {2, *p*} is normal in base 2 for every odd prime *p*.
'''
scope = '''
The integer *q* may be composite; the indices are then the products of powers of the single integer *q* with powers of *p* (for *q* = 6 they are 6ᵃ*p*ʲ, not all integers with prime factors in {2, 3, *p*}). When *q* is prime, normality is a case of LS-01 with *P* = {*q*, *p*}; the new content is the explicit rate. The constant *A* depends on *b*, *q* and *p* and is not computed. Normality for odd composite parameters, all orders and polynomial weights is LS-05; it has no rate.
'''
lean = [
  "NormalityChecker.Localized.discrepancy_rate",
  "NormalityChecker.Localized.interval_discrepancy_rate",
  "NormalityChecker.Localized.series_normal",
  "NormalityChecker.Localized.normal",
  "NormalityChecker.Localized.binary_series_normal",
]
proof = [
  "notes/mixed-localized-logarithms.md",
  "notes/mixed-localized-logarithms.md#quantitative-interval-discrepancy",
]
supersedes = [
  "NormalityChecker.LocalizedFive.binary_normal",
  "NormalityChecker.LocalizedFive.series_binary_normal",
]
