The unit numerators give Corollary 1.3 of Paper II. Each coordinate uses the same support and the same position *n*. The support may contain primes dividing *b*, and the numerators may have either sign and any degree. Mira’s S09, Theorem 2, already treats distinct prime/order pairs on singleton supports, including the fixed-prime specialization for unit numerators. Repeating an order can give identical coordinates. The proof supplies a limiting frequency for each box.
'''
