[[result]]
id = "LS-07"
title = "Finite-depth termination at large order"
topic = "localized"
status = "paper"
statement = '''
Fix a prime *p*. For all sufficiently large orders *s*, every finite set of primes *P* containing *p*, and every *b* ≥ 2 with *p* ∤ *b*, the order-*s* certificate of LS-03 for *p* vanishes at a finite depth determined by the top row alone; the required precision is *o*(*s*) as *s* → ∞, uniformly in *P* and *b*. For *p* = 3 this holds for every *s* ≥ 2.
'''
scope = '''
This is a written proof, not a Lean theorem. For general *p* the proof gives no numerical threshold for *s*, because it uses the Subspace Theorem over ℚ at the place *p*. The explicit case *p* = 3 uses lifting the exponent for 2ˢ ± 1. Small orders with several cofactor primes are not covered (see LS-06).
'''
proof = ["notes/fixed-depth-question.md#arbitrarily-many-cofactor-primes-at-large-order"]
inputs = ["Schlickewei's p-adic Subspace Theorem over the rationals, in the form of F. Luca, J. Ouaknine and J. Worrell, Bull. London Math. Soc. (2025), Theorem 2 (doi:10.1112/blms.70033)"]
