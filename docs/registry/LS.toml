[[result]]
id = "LS-06"
title = "Finite-depth termination on two-prime full supports"
topic = "localized"
status = "paper"
statement = '''
Let *p* ≠ *q* be primes, *b* ≥ 2 with *p* ∤ *b*, and *s* ≥ 1, and take *P* = {*p*, *q*} in LS-01. Then the order-*s* certificate of LS-03 for the selected prime *p* vanishes at some finite depth: there is *k* with *F*<sub>*k*</sub> empty, so every cell passes and *C*<sub>*k*</sub> = 0. Moreover, for odd *p*, every one-sided value of the function *V*<sub>*p*,*s*</sub> of LS-02 is transcendental over ℚ.
'''
scope = '''
This is a written proof, not a Lean theorem; Lean proves only nullity and convergence of the certificates (LS-03). The result holds for every residue of the radix, including when *q* also does not divide *b*. It concerns the full unsigned support with one cofactor prime. For fixed small order and two or more cofactor primes, finite termination remains open. It fails for masked supports: at *b* = 10, *p* = 3, *s* = 1 and *P* = {2, 3, 5} the paper constructs one fixed cofactor mask whose test fails at every precision.
'''
proof = [
  "notes/fixed-depth-question.md#one-cofactor-prime-and-all-periodic-weights",
  "notes/fixed-depth-question.md#a-single-fixed-mask-with-failure-at-every-depth",
]
