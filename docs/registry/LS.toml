[[result]]
id = "LS-05"
title = "Rational polynomial weights on two-generator supports"
topic = "localized"
status = "lean"
statement = '''
Let *b*, *q*, *c* ≥ 2 be integers with gcd(*b*, *c*) = 1, such that every prime factor of *q* divides *b*. Let *P* be a nonzero polynomial with rational coefficients and let *s* be an integer with deg *P* < *s*. Then

```math
\sum_{a=0}^{\infty} \sum_{j=0}^{\infty} \frac{P(q^a c^j)}{(q^a c^j)^s \, b^{q^a c^j}}
```

is normal in base *b*. Likewise, for every infinite set *E* of nonnegative integers,

```math
\sum_{j \in E} \frac{P(c^j)}{c^{js} \, b^{c^j}}
```

is normal in base *b*.
'''
scope = '''
The parameter *c* may be composite and need not be prime or odd, only coprime to *b*. Taking *P* = 1 gives the localized polylogarithm of order *s* on the indices *q*ᵃ*c*ʲ. Taking *P*(*X*) = λ₁*X*<sup>*s*−1</sup> + λ₂*X*<sup>*s*−2</sup> + … + λ<sub>*s*</sub> gives the finite signed rational combination of the orders 1, …, *s* with coefficients λᵢ, normal whenever these coefficients are not all zero; for example 7/*m* − 3/*m*² + 5/*m*⁴ corresponds to *P* = 7*X*³ − 3*X*² + 5 and *s* = 4. The set *E* in the second series may have arbitrarily long gaps; with finitely many terms the sum would be rational. The indices *q*ᵃ*c*ʲ are distinct because gcd(*q*, *c*) = 1. No discrepancy rate is given.
'''
lean = [
  "NormalityChecker.Localized.Composite.Generators.mixed_rational_normal",
  "NormalityChecker.Localized.Composite.Generators.series_normal",
  "NormalityChecker.Localized.Composite.Generators.normal",
  "NormalityChecker.Localized.Composite.Generators.restricted_axis_normal",
  "NormalityChecker.Localized.Composite.Generators.axis_rational_normal",
]
proof = [
  "notes/polynomial-certificates.md#why-signed-orders-survive-together",
  "notes/composite-generators.md",
]
