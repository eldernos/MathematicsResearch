[[result]]
id = "LS-08"
title = "Order two: a deeply failed cell need not clear the prime"
topic = "counterexamples"
status = "lean"
statement = '''
Take *b* = 36, *s* = 2, *P* = {2, 3, 7}, the selected prime *p* = 7 and the position *n* = 186, and let

```math
R = \sum_{m \in M(P), \ m \le 186} \frac{36^{\, 186 - m}}{m^2}
```

be the shifted rational prefix of order two. Then ⌊log₇ 186⌋ = 2, the order-two residue test for 7 fails at the cell 186 at precision 3 (it vanishes modulo 7³), every *m* ∈ *M*(*P*) with *m* ≤ 186 satisfies *m* + 16 ≤ 186, and the reduced denominator of *R* is exactly 7.
'''
scope = '''
All four assertions are finite and checked by kernel reduction. The example refutes a proposed one-step implication at order *s* > 1: a failure of the deepest single-order test at a position whose insertions are all old, with every other support prime dividing the radix, need not remove *p* from the reduced denominator. At order one the implication holds. The example does not contradict LS-01 or LS-02, whose limiting tests use all orders 1 through *s*.
'''
lean = ["NormalityChecker.LocalizedSupport.order_two_deep_counterexample"]
proof = ["notes/joint-persistent.md#higher-orders-and-the-lower-order-residues-paper-proof"]
related = ["LS-02"]

[[result]]
id = "LS-09"
title = "Joint rectangle frequencies at distinct localized orders"
topic = "localized"
status = "lean"
statement = '''
Let *S* be a finite set of primes, at least one of which does not divide the radix *b* ≥ 2. Let *M*(*S*) consist of the positive integers supported on *S*, including 1. Choose pairwise distinct positive integers *s*₁, …, *s*<sub>*d*</sub> and rational polynomials *P*ᵢ with *P*ᵢ(0) ≠ 0. Define

```math
X_i=\sum_{m\in M(S)}\frac{P_i(m)}{m^{s_i} b^m}.
```

The fractional parts of the *d* values *b*ⁿ*X*ᵢ are jointly uniformly distributed. For every half-open box, the proportion of 0 ≤ *n* < *N* at which all coordinates lie in the box tends to the product of its side lengths.
