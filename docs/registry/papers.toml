# Manuscript index used for the README table, docs/results.md and the research site.
# The canonical publication status is papers/README.md. Keep `status` in step with it.
# Allowed status values: planned, draft, internally reviewed, external review, published.
# None of these manuscripts has been peer reviewed or accepted.
#
# Keys of a [[paper]] table (see also docs/registry/SCHEMA.md):
#   number      Roman numeral of the manuscript; a revision keeps the number of the paper it replaces.
#   version     Manuscript version, for example "1.1" or "2.0".
#   release     Release tag that carries this exact manuscript text.
#   tags        Every release tag that contains this directory (version history, newest last).
#   supersedes  Directory of the earlier version that this entry replaces ("" if none). The earlier
#               entry stays below as the historical record and its files are never edited.
#   families    Registry prefixes mapped to this manuscript (docs/results.md "Paper" column).
#   principal   Results shown in the README table.
#   results     Optional extra registry identifiers that map to this manuscript regardless of family.
#   abstract    Abstract of a released manuscript. For a manuscript with a metadata.toml the
#               abstract and keywords are read from that file instead and `summary` is ignored.
#   keywords, msc_primary, msc_secondary   Classification of a released manuscript that has no metadata.toml.
#   summary     One-sentence description used only until the manuscript's metadata.toml exists.
# Entries for papers/*-v2 and the new papers 06 to 09 are candidates for release manuscripts-v2.0.0.

[[paper]]
number = "I"
version = "1.1"
release = "manuscripts-v1.1.0"
tags = ["manuscripts-v1.0.0", "manuscripts-v1.1.0"]
dir = "papers/01-stoneham-polynomials"
title = "Polynomial Images of Stoneham Numbers with an Odd Prime-Power Parameter"
families = ["ST"]
principal = ["ST-01", "ST-05", "ST-02", "ST-03"]
status = "internally reviewed"
abstract = '''
For an odd prime *p* not dividing *b* and a positive integer *e*, every nonconstant rational polynomial in the Stoneham number with parameters *b* and *p*ᵉ is normal in base *b*, and distinct positive powers of that number have jointly uniformly distributed radix orbits. After reflection, the retained exponent vectors form an upward-closed set; the numerator of the resulting generating function is congruent to 1 modulo *p* − 1 at *z* = *p*, so a growing prime power survives at every sufficiently late shift. The paper also treats products along one prime axis, combinations with a unique leading monomial, the exact denominator profile of the binary Stoneham square, and strict upper discrepancy for products with multiplicatively independent parameters. The last result is a paper deduction, with a Lean bound of 43/45 for the binary product with parameters 3 and 5.
'''

[[paper]]
number = "II"
version = "1.1"
release = "manuscripts-v1.1.0"
tags = ["manuscripts-v1.0.0", "manuscripts-v1.1.0"]
dir = "papers/02-localized-normality"
title = "Normality of Localized Logarithms and Polylogarithms on Finite Prime Supports"
families = ["LS", "MW"]
principal = ["LS-01", "MW-01", "LS-02", "LS-03"]
status = "internally reviewed"
abstract = '''
Restrict the series for a polylogarithm of positive integer order to the integers whose prime factors lie in a finite set. With numerator 1 on the full support, the resulting radix expansion is normal when some support prime does not divide the radix, and its discrepancy tends to one otherwise. For a nonzero rational polynomial weight *P*(*m*) on the full support, normality holds exactly when *P* vanishes at zero to order less than *s* and some support prime does not divide the radix. The proof identifies the limiting discrepancy with the measure of a persistent cancellation region and shows that this region is null, using recurrence on a logarithmic circle, multiplicative finite differences and *p*-adic separation of finitely many geometric rays.
'''

[[paper]]
number = "III"
version = "1.1"
release = "manuscripts-v1.1.0"
# Retained unchanged in the candidate release manuscripts-v2.0.0.
tags = ["manuscripts-v1.0.0", "manuscripts-v1.1.0", "manuscripts-v2.0.0"]
# The archived directory has no metadata.toml and is never edited, so its classification is recorded here.
keywords = ["normal numbers", "Stoneham numbers", "discrepancy", "cyclotomic resonance", "signed expansions"]
msc_primary = "11K16"
msc_secondary = ["11K38", "11A63"]
dir = "papers/03-signed-resonance"
title = "Resonance and Discrepancy in Signed Stoneham Expansions"
families = ["CR", "DS"]
principal = ["CR-01", "DS-01", "DS-03", "DS-04"]
status = "internally reviewed"
abstract = '''
A cyclotomic test decides normality of finite rational combinations of Stoneham-type components and produces nonnormal sums of normal numbers in every radix. For signed expansions with bounded phases, the asymptotic interval discrepancy equals the upper density of positions in zero-phase shells. Rational translation multiplies this discrepancy by the discrepancy of the rational orbit, and the attainable values are exactly the radix values of binary histories that dominate all of their suffixes in lexicographic order.
'''

[[paper]]
number = "IV"
version = "1.1"
release = "manuscripts-v1.1.0"
tags = ["manuscripts-v1.0.0", "manuscripts-v1.1.0"]
dir = "papers/04-arithmetic-certificates"
title = "Arithmetic Certificates for Normality and Their Limitations"
families = ["AC"]
principal = ["AC-01", "AC-02", "AC-03"]
status = "internally reviewed"
abstract = '''
Normality follows when most blocks of a radix orbit are approximated in mean by rational orbits whose denominators grow, are polynomially bounded and have prime factors in a fixed finite set. Partial coverage gives explicit discrepancy bounds, and overlapping certificates combine through endpoint paths and joint failure accounting. Two accurate smooth rational models on a common block must coincide modulo one, and a counting argument limits what such models can explain.
'''

[[paper]]
number = "V"
version = "1.1"
release = "manuscripts-v1.1.0"
tags = ["manuscripts-v1.0.0", "manuscripts-v1.1.0"]
dir = "papers/05-classical-denominators"
title = "Reduced Denominators of Binary Logarithm and Arctangent Series"
families = ["CC"]
principal = ["CC-01", "CC-02"]
status = "internally reviewed"
abstract = '''
A finite dyadic identity for ln 2 has shifted binary prefixes whose reduced denominators grow at exponential rate one half, and this rate is optimal among finite dyadic logarithm identities, using Bang's primitive-divisor theorem. The paper studies corrected rational models, numerator residues, prime-power sieves, and analogous questions for π, *e* and rational arctangents. It does not establish normality, or an asymptotic discrepancy bound below one, for any of these constants.
'''

