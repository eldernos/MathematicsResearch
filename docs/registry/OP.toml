id = "OP-01"
title = "Exact limiting discrepancy spectrum for addition"
topic = "discrepancy"
status = "paper"
principal = true
statement = "In every integer radix b ≥ 2, α, β, γ in [0,1] are the ordinary limiting extreme discrepancies of x, y and x+y exactly when max(0, α+β−1) ≤ γ ≤ 1−|α−β|."
scope = "The inequalities hold at every positive finite prefix. Five rational orbit types suffice for the limiting realization. The discrepancy is unanchored."
proof = ["notes/phase19/addition.md"]
related = ["SY-03","SY-04"]

