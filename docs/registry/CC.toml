The count is logarithmic, not linear, so the finite bound tends to 1 and gives no limiting bound below 1. A linear count, equivalently any of the two density conditions, is open. The window constant 34 comes from a Lean irrationality-type separation; Marcovecchio's irrationality measure improves the constant on paper. No result in this family proves normality, or a limiting binary discrepancy below 1, for ln 2, π, *e* or the golden ratio; the target *D*∞ ≤ 0.9999 for ln 2 remains open.
