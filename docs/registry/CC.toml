[[result]]
id = "CC-01"
title = "Half-rate denominators for binary shifts of ln 2"
topic = "classical"
principal = true
status = "lean"
statement = '''
The identity (1 + 2⁻³)/(1 − 2⁻²)² = 2 gives

```math
\ln 2 = 2 \sum_{j=1}^{\infty} \frac{1}{j \, 4^j} + \sum_{j=1}^{\infty} \frac{(-1)^{j+1}}{j \, 8^j} .
```

For *N* ≥ 0 multiply by 2ᴺ and keep the terms whose binary exponent is at most *N*:

```math
Y_N = \sum_{1 \le j \le N/2} \frac{2 \cdot 2^{N - 2j}}{j} + \sum_{1 \le j \le N/3} \frac{(-1)^{j+1} \, 2^{N - 3j}}{j} .
```

Then 0 ≤ 2ᴺ ln 2 − *Y*<sub>*N*</sub> ≤ 4/(*N* + 1) for every *N*. The reduced denominator *q*<sub>*N*</sub> of *Y*<sub>*N*</sub> divides the least common multiple of 1, …, ⌊*N*/2⌋, and

```math
\lim_{N \to \infty} \frac{\log q_N}{N} = \frac{1}{2} .
```
'''
scope = '''
The rate concerns the reduced denominator of this prescribed truncation at a common binary exponent, at every *N* (odd *N* and partial periods included). The standard series has rate 1 (CC-03). The lower bound uses survival of every prime in (*N*/*K*, *N*/2] for each fixed *K* and the prime number theorem as formalized in Mathlib. Among finite dyadic logarithm identities the rate 1/2 is optimal (CC-02). A denominator rate is an arithmetic statement about rational models; it gives no digit-frequency information. No result in this family proves normality, or a limiting binary discrepancy below 1, for ln 2, π, *e* or the golden ratio; the target *D*∞ ≤ 0.9999 for ln 2 remains open.
'''
lean = [
  "NormalityChecker.StrideDenominatorRate.log_denominator_rate",
  "NormalityChecker.logTwo_two_stride_series",
  "NormalityChecker.twoStridePrefix_tail",
  "NormalityChecker.twoStridePrefix_den",
  "NormalityChecker.StrideDenominatorRate.band_survival",
  "NormalityChecker.twoStridePrefix_survival",
]
proof = [
  "notes/strided-logarithm.md",
  "notes/corrected-strides.md#actual-rates-for-the-uncorrected-logarithms",
]
computation = ["scripts/strided_logarithm.py"]
related = ["CC-02", "CC-03", "CC-12"]

[[result]]
id = "CC-02"
title = "The rate 1/2 is optimal among finite dyadic logarithm identities"
topic = "classical"
principal = true
status = "lean+paper"
statement = '''
Let *a*₁, *a*₂, … be integers, only finitely many nonzero, with

```math
\sum_{k \ge 1} a_k \log\left( 1 - 2^{-k} \right) = m \ln 2
```

for some integer *m*. Expanding each logarithm and grouping by binary exponent gives integers *W*(*n*) with the sum equal to Σ *W*(*n*)/(*n* 2ⁿ). For *N* ≥ 0 let *Y*<sub>*N*</sub> be the sum of *W*(*n*) 2ᴺ⁻ⁿ/*n* over 1 ≤ *n* ≤ *N*, and let *q*<sub>*N*</sub> be its reduced denominator. Suppose only finitely many *v* ≥ 1 have *Y*ᵥ = 0. Then log *q*<sub>*N*</sub> / *N* converges to a limit *R* with *R* ≥ 1/2, and *R* = 1/2 if and only if *a*₁ = 0.
'''
scope = '''
Identities that also use log(1 + 2⁻ᵏ) are covered after the paper rewriting log(1 + *x*) = log(1 − *x*²) − log(1 − *x*), which preserves every binary-exponent coefficient. The Lean theorem `optimal_rate` assumes, instead of the identity, that the odd-prime valuations of the product of (2ᵏ − 1) to the powers *a*ₖ balance, which is equivalent to the sum being an integer multiple of ln 2; it also takes as an explicit hypothesis that each 2ᵏ − 1 with *k* > 6 and *a*ₖ ≠ 0 has a primitive odd prime divisor. That hypothesis is supplied by Bang's theorem. The finiteness of the zero set is a hypothesis in Lean; on paper it holds whenever *m* ≠ 0, since the partial sums tend to *m* ln 2. With these inputs only strides 1, 2, 3, 6 survive and *a*₁ = 0 gives a multiple of the two-stride series of CC-01. The general rate formula, one minus the sum of 1/*v* − 1/(*v* + 1) over the zeros *v*, is `LogarithmBands.denominator_rate`. Odd-denominator series such as atanh(1/3) lie outside the class. No result in this family proves normality, or a limiting binary discrepancy below 1, for ln 2, π, *e* or the golden ratio; the target *D*∞ ≤ 0.9999 for ln 2 remains open.
'''
lean = [
  "NormalityChecker.DyadicRelations.optimal_rate",
  "NormalityChecker.DyadicRelations.coefficients_of_valuations",
  "NormalityChecker.DyadicRelations.strict_half_of_first_band",
  "NormalityChecker.LogarithmBands.denominator_rate",
]
proof = [
  "notes/strided-logarithm.md#why-half-is-optimal-in-this-class",
  "notes/strided-logarithm.md#the-residue-of-the-actual-numerator",
]
inputs = "Bang's primitive divisor theorem (Bang 1886; Zsigmondy 1892): for every k > 6, 2<sup>*k*</sup> − 1 has a prime divisor dividing no 2<sup>*j*</sup> − 1 with 0 < j < k. The prime number theorem enters through Mathlib inside the Lean rate formula."
related = ["CC-01", "CC-06"]

