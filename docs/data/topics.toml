modules = [
  "CoefficientTransfer", "GeneralMassTransfer", "RadixWidthLaw", "DerivativeTransfer",
  "NormalReciprocalCore", "SimpleNormalityKernel", "RadixPowerTower", "Phase22Cores",
  "HigherOrderTower", "Phase23Cores",
  "EulerPentagonal", "CharacterLambertTransfer", "AntisymmetricLambert",
  "ClassicalBarriers", "ProtectedPole", "PowerSumPeeling",
  "DiscrepancyGeometry", "SurvivingGrid", "PrimePowerGrid", "AdditionSpectrum",
  "SharpTranslation", "Phase18Synthetic", "PositiveSummation", "RetirementDenominator",
  "Phase17DiscrepancyBounds", "ComputableNormalityUndecidability",
