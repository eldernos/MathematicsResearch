[[family]]
id = "BF-14"
name = "Partition generating function"
definition = "P_b = 1/E_b = Σ_{n ≥ 0} p(n) b^{−n} for integers b ≥ 2"
radices_scope = "construction radix b"
full_normality = "open"
simple_normality = "open"
disjunctivity = "open"
discrepancy_status = "open"
