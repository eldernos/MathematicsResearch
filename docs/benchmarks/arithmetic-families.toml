summary = "Open in every radix, including both P_b ∈ K_b and P_b ∉ K_b. Carry windows are sharp to log_b N + O(1) digits, or (3/4) log_b N + O(1) with the η-refinement; the pentagonal recurrence admits both the zero orbit and equidistributed orbits; rational approximants 1/E_b^{(K)} track P_b for only Θ(√m_K) digits against periods at least m_K − O(1) (GF-17). Intermediate partition products P_b(M) can achieve lim inf D_N = 0 even for sets M of upper density 1 (GF-27); for Mahler's m-ary partition series X_{b,m}, K_b-membership transfers up the 2-power tower, (b_m(n) mod m^L) is m-automatic with a sharp (1/2 − ε)(log_m k)² perturbation barrier, 1/X_b is the signed Thue–Morse series Y_b ∉ K_b while 1/X_{b,m} ∈ K_b for m ≥ 3 (see BF-27), and gauge complexity is governed by a 3-state automaton (GF-32, GF-38). Partial products R_k^{(E)} = ∏_{j=1}^k (1 − b^{−j})^{−1} enjoy complete-period exponential equidistribution (GF-34) and exact quadratic period asymptotic ln T_k^{(E)} = (1/2 − 3/π²)(ln b) k² + O_b(k ln² k), with a short-orbit Weyl characterization of D⁺(P_b; b) < 1 (GF-38). Ramanujan congruences wash out of the digits (GF-08)."
