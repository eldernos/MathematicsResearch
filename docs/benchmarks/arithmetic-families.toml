summary = "Eventually the nonzero digits are isolated 1s at the positions n_k. Hence the digit 0 has frequency 1, long runs of 1s never occur (and no digit above 1 occurs when b ≥ 3), and the support count is o(X); the linear-mass transfer gives D_N → 1, that is membership in K_b (GF-01), with the explicit rate of GF-02."
