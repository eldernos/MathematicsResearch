[[family]]
id = "BF-18"
name = "Erdős–Borwein-type divisor series"
definition = "E(b) = Σ_{n ≥ 1} 1/(bⁿ − 1), E_odd(b) = Σ_{n odd} 1/(bⁿ − 1), and the residue-class sums Σ_{m ≡ r (mod q)} 1/(b^m − 1)"
radices_scope = "construction radix b"
full_normality = "open"
simple_normality = "open"
disjunctivity = "partial"
discrepancy_status = "open"
barrier_status = "barrier_proved"
evidence = "external"
registry_ids = ["CC-20", "CC-21", "CC-49", "GF-07", "GF-18", "GF-28"]
external_sources = [
  "Erdős 1948: irrationality of E(2)",
  "Borwein 1991: irrationality of Σ 1/(qⁿ + r) for integers q ≥ 2 and rational r ≠ 0 with r ≠ −qⁿ",
  "Captain Sude 2026, release erdos-borwein-disjunctivity-elementary (8 September 2026, commit d51e93e): base-2 disjunctivity of E(2)",
]
summary = "Only E(2) is known to be disjunctive, by an external input. The four residue-class sums modulo 8 and E_odd(2) have identical D⁻, D⁺ and limit sets, and for 2-elementary quotients all coset differences lie in K_b in every radix (GF-07). For E(2), sixteen columns is the sharp minimal truncation, low-order moment and trigonometric certificates fail (CC-49), and an outward-rounded order-6 certificate establishes the universal minimal correlation-order bound 7 ≤ r_min(D) ≤ 92 for every D ≥ 16 (GF-28); complementary coverage blocks additive K_b-cancellation (GF-18). The companion E_+(b) = E(b) − 2 E(b²) has kernel-verified coefficient laws and a 14-column two-sided model (GF-28)."
open_frontier = "Simple non-normality of E(2), that is f(1) < 1/2; D⁺(E; 2) < 1 independently of the external input in CC-21; K_b status of any member; lattice-scale r-point divisor correlations with r ≥ 7."

# --------------------------------------------------------- valuation and pole schedules

[[family]]
id = "BF-19"
name = "Valuation-weighted power schedules"
definition = "C(b, p, s, d) = Σ_{i ≥ 1} p^{−s v_p(i)} b^{−t i^d} for an odd prime p not dividing b, t = ord_p(b), s ≥ 0 and d ≥ 2, and rational polynomials in one or several such numbers with a common d"
radices_scope = "construction radix b"
full_normality = "partial"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "partial"
barrier_status = "barrier_proved"
evidence = "paper"
registry_ids = ["SY-02", "OP-14", "GF-11", "GF-14", "GF-24", "GF-25"]
external_sources = []
summary = "For s ≥ 1, every nonconstant rational polynomial of degree r < d in C is normal (GF-11) with the explicit rate D_N ≪ (log log N)^{−d/(d − 1)} across the entire range d ≥ r + 1 via uniform short-orbit cancellation (GF-25, closing the gap of GF-14; in particular D_N(C(2, 3, 1, 3)²; 2) ≪ (log log N)^{−3/2}), and multivariate polynomials of total degree r < d in distinct orders s_a are normal (GF-14). For s = 0 the discrepancy tends to 1 (SY-02). At the boundary d = r, total-depth retirement splits p^{sH} C^r = X_H + Z_H with X_H ∈ K_b at d = 2, encountering the Hooley gap-moment barrier (and three-cubes obstruction at d = 3), while short runs fall below log_b(ε q) (GF-14, GF-24)."
open_frontier = "The equality boundary d = r, notably C(2, 3, 1, 3)³ and C(b, p, s, 2)²; power-saving discrepancy rates for r ≥ 2."

[[family]]
id = "BF-20"
name = "All-prime protected-pole algebras"
definition = "W = Σ_{k ≥ 1} 1/(p^{k²} ℓ_k b^{2^{k³}}), with p an odd prime not dividing b and ℓ_1 < ℓ_2 < … the other primes coprime to b, its variants on denser schedules, and the polynomial algebras these series generate"
radices_scope = "construction radix b"
