registry_ids = ["GF-03", "GF-04", "GF-06", "GF-08", "GF-12", "GF-17", "GF-19", "GF-20", "GF-27", "GF-29", "GF-37"]
external_sources = [
  "Euler 1750 (published 1760): pentagonal number theorem",
  "Jacobi 1829: the cube of Euler's product",
  "Nesterenko 1996: transcendence of E_b, hence of every E_b^r",
  "Serre 1985: lacunarity of the even powers η^r for r ∈ {2, 4, 6, 8, 10, 14, 26}",
]
summary = "r = 1: E_b ∈ K_b with exact gap √(2/3) (log_b N)/√N, simply normal only for b = 2, never disjunctive (GF-03). r = 3: E_b³ ∈ K_b with exact gap √2 (log_b N)/√N, disjunctive, simply normal only for b = 2 (GF-04). Iterated derivatives D^j E_b, D^j E_b³ (j ≥ 1) and E_b² · DE_b are disjunctive, base-2 simply normal and not simply normal for b ≥ 3 (GF-19, GF-20). r = 2: E_b² ∈ K_b with exact radix-dependent constants of order (log log N)/(log N)^{3/4} (GF-04, GF-12), non-congruence prime sign rule x² + 36y² versus 4x² + 9y², positive lower frequencies for both 0^L and (b − 1)^L (GF-20, GF-27), and explicit lower binary digit frequency 1/26 for both digits 0 and 1 and constant words 0^L, 1^L on E_2² (tightening GF-29's 1/40000 by more than 1,538×, GF-37). For r ≥ 4, coefficient transfer fails (GF-06), CM width W_U(N) ≍ N √(log N) blocks sparse and width transfers (GF-17), and the NAF entropy–multiplicity wall blocks signed-digit sparse transfers (GF-27)."
open_frontier = "Any distributional property of E_b^r for r ≥ 4; simple normality and disjunctivity of E_b²."

[[family]]
id = "BF-09"
name = "Rational scalings of Euler powers"
