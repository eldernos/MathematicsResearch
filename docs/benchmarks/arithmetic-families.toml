# ------------------------------------------------------- Lambert and divisor series

[[family]]
id = "BF-15"
name = "Multiplicative Lambert series"
definition = "L_f = Σ_{n ≥ 1} c(n) 2^{−n} for a nonnegative integer multiplicative function c with c(p^e) ≤ e + 1, c(p) = 2 on a prime set S of reciprocal-sum density δ ∈ (0, 1) that contains a full reduced residue class, and c(p) = 0 on the other primes coprime to the modulus; this includes L_χ(2) = Σ χ(m)/(2^m − 1) for every real nonprincipal character χ, with δ = 1/2"
radices_scope = "base 2"
full_normality = "proved_nonnormal"
simple_normality = "proved_not_simply_normal"
disjunctivity = "proved_disjunctive"
discrepancy_status = "maximal_K_b"
barrier_status = "resolved"
evidence = "lean+paper"
registry_ids = ["CC-46", "CC-48", "GF-05", "GF-12", "GF-20", "GF-21", "SY-24"]
external_sources = [
  "Shiu 1980: Brun–Titchmarsh theorem for multiplicative functions",
  "Wirsing 1961: mean values of multiplicative functions",
  "Perelli–Pintz–Salerno 1985: short-interval Bombieri–Vinogradov theorem",
  "Hamieh–Murty 2016: transcendence of Lambert series with odd character coefficients",
]
summary = "Every fixed word w ≠ 0^k occurs ≍ H/(log N)^{1−δ} times in late windows [N, N + H) with N^a ≤ H ≤ N, a > 7/12; hence L_f is irrational and disjunctive, its digit 0 has frequency 1, it lies in K_2, and 1 − D_N ≍ (log log N)/(log N)^{1−δ} (CC-48). For real characters 1 − D_N ∼ (C_χ/(2 log 2)) (log log N)/√(log N) (GF-05), with f_{0^L} → 1 and exact radix-dependent constants in every radix (GF-12, GF-20), plus even-composite threshold jumps δ_b∗ = β_b/(β_b + log 2) (GF-21); L_χ is transcendental for odd χ (CC-48)."
open_frontier = "Transcendence for even characters and for non-character multiplicative coefficients; exact constants above the critical density threshold δ_b∗ without the hypothesis (R_b) of GF-12."

[[family]]
id = "BF-16"
name = "Even-order character Lambert series and q-digamma reflections"
definition = "Integer-valued combinations of Σ_{m ≥ 1} χ(m)/(b^m − 1) over Dirichlet characters χ of even order, Lambert series Σ w(m)/(b^m − 1) of odd periodic integer weights w, and the normalized q-digamma reflections (ψ_q(r/M) − ψ_q((M − r)/M))/log q at q = b^{−M}"
radices_scope = "construction radix b"
full_normality = "proved_nonnormal"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "maximal_K_b"
barrier_status = "resolved"
evidence = "lean+paper"
registry_ids = ["GF-13", "GF-19", "GF-20", "GF-22"]
external_sources = []
summary = "Every member lies in K_b with 1 − D_N ≪ (log log N)/(log N)^{1/h_max} (GF-13), hence none is simply normal for b ≥ 3 or 2-normal in base 2 (GF-19). For q-digamma reflections with r = 1, τ_{1,M} − τ_{M−1,M} ≥ 0 everywhere iff M ∣ 24 (giving f_{0^L} → 1 in every base, GF-20). Single-character series F_b(Φ ∘ (1 ∗ χ)) are base-b disjunctive in every radix b ≥ 2 (GF-22)."
