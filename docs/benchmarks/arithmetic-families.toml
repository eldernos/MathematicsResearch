[[family]]
id = "BF-13"
name = "Higher-weight modular values and theta powers"
definition = "f(1/b) for integer-coefficient modular forms of weight at least 2, including E_b^r (r ≥ 4), Θ_3(1/b)³, Θ_3(1/b)⁴, the Eisenstein values E_4(1/b), E_6(1/b), the discriminant Δ(1/b), and the quasimodular E_2(1/b)"
radices_scope = "construction radix b"
