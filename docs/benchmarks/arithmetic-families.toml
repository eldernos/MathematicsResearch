external_sources = []
summary = "Θ_Q(1/b) ∈ K_b with f_{0^L} → 1 (never simply normal in any radix, GF-19, GF-20) and 1 − D_N of exact order (log log N)/√(log N) (GF-06, GF-12). For every fundamental discriminant Δ < 0, exact leading constants are proved unconditionally in every radix: C_Δ (1 + log 2 · E[1 − 1/d])/(2 log b) for b = 2^k via Strassmann vanishing, and C_Δ (1 + log 2)/(2 log b) for all b ≠ 2^k via unconditional proof of (V_q) (GF-21). For m² + n² in base 2 the constant is K/(2 log 2) and the number is disjunctive (GF-05, CC-46)."
open_frontier = "Exact leading constants for non-fundamental discriminants; disjunctivity for general Q."

[[family]]
id = "BF-12"
name = "Integer-coefficient weight-one modular forms"
definition = "f(1/b) for a holomorphic weight-one modular form f = Σ_{n ≥ 0} a(n) qⁿ on Γ_1(M) with every a(n) ∈ ℤ"
