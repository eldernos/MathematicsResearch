radices_scope = "construction radix b"
full_normality = "partial"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "partial"
digit_frequency_status = "partial"
barrier_status = "no_barrier_recorded"
evidence = "lean+paper"
registry_ids = ["GF-04", "GF-16", "GF-20", "GF-27", "GF-30", "GF-37"]
external_sources = []
summary = "D_N((a/d) E_b) and D_N((a/d) E_b³) converge without oscillation to exact rational limits in [1/d, 1) via finite residue automata with error O((log N)/√N) (GF-16); signed automata give exact rational word frequencies, prove (a/d) E_b is never disjunctive, and odd-order complement symmetry proves (a/d) E_2 and (a/d) E_2³ are base-2 simply normal whenever ord_d(2) is odd (GF-20). GF-30 proves nonzero-atom c ↦ −c symmetry for all coprime d, verifies Conjecture 5.5 for all odd d ≤ 20,000 on E_2 and d ≤ 3,000 on E_2³, refutes the radix-free converse via (a/113) E_{10}, transfers odd-order symmetry to D^j E_b³ at 3 ∥ d via kernel-verified content 3, and proves (a/2) E_b² has exact middle-digit frequency 2/3 in odd base b (while GF-27 makes (a/d) E_b² ∉ K_b unconditional for all d ≥ 2 coprime to b). GF-37 proves primitive-root impossibility for Conjecture 5.5 in every base b ≥ 3, exhibits new balanced b-exceptional primes (4, 29), (6, 59), (6, 1613) and infinite progressions, and confirms 0 binary exceptions through p ≤ 40,000."
open_frontier = "The exact limit law of (a/d) E_b² for odd d > 1 and the 1/3 split of (a/2) E_b²; Conjecture 5.5 for all odd d in base 2; disjunctivity of (a/d) E_b² and (a/d) E_b³."

[[family]]
id = "BF-10"
name = "Normal reciprocals of kernel elements"
definition = "1/x for x = ∏_{k ≥ 1} (1 + ε_k b^{−m_k}), with signs ε_k ∈ {−1, +1} and an exponent sequence (m_k) admissible in the sense of GF-16"
radices_scope = "construction radix b"
full_normality = "classified"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "partial"
digit_frequency_status = "partial"
barrier_status = "barrier_proved"
evidence = "lean+paper"
registry_ids = ["GF-08", "GF-16", "GF-26", "GF-34", "GF-38"]
external_sources = []
summary = "Exact multiplicative-order period identities are kernel-verified for both signs under D ∣ b^m − 1, with Hull–Dobell rad∗(D) lifting and relaxed divisibility resolved in GF-26. With every ε_k = −1, x is irrational and deep in K_b while 1/x is normal along all N with improved balanced-multiplier rate at ω_k = D_{k−1} (GF-16, GF-26). In general 1/x is normal iff ε_k = −1 eventually, else lim sup D_N ≥ 1/2 with exact limits for periodic sign patterns; cyclotomic factors P_k(q) realize every D⁺(1/x; b) = α ∈ [0, 1] with base-2 simple normality (GF-26). GF-34 further establishes dense convergent reciprocal discrepancies in [0, 1] via +1-inversion, unconditional all-base L-normal nonnormal reciprocals for every b ≥ 2 and L ≥ 1 (resolving Phase 22 Open Problem 5), and anchored coprime non-tetration normal reciprocals with doubly exponential growth and rate O_{b,A}((ln N)^{−A}) for every A > 0. GF-38 extends density of A_conv(2^e) to every power of two and proves the universal doubly-exponential period-growth barrier liminf (ln ln T_k)/k ≥ ln(1 + θ) under m_k ≥ T_{k−1}^θ (showing GF-34's growth is optimal at θ = 1)."
open_frontier = "Realizing arbitrary irrational α ∈ (0, 1) as an exact convergent reciprocal limit; non-dyadic density of A_conv(b); reciprocals of other kernel elements, notably P_b = 1/E_b (BF-14)."

[[family]]
