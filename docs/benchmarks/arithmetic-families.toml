external_sources = []
summary = "Every nonconstant rational polynomial P(W) is normal and Liouville with D_N ≪ exp(−c (log N)^{2/3}), and every prime coprime to b divides the shifted prefix denominators of W from some point on (GF-10). Normality persists on exp(k (log log k)²), on polynomial schedules t k^d across the entire range d ≥ r + 1 with explicit rate O_P((log log N)^{−d/(d − 1)}), and for every degree on quasi-polynomial schedules (GF-15, GF-25). Non-Liouville all-prime constructions achieve exact finite irrationality exponents μ = λ > 2 for degree ≤ r at power-saving rate O(N^{−η}) and μ = p across all degrees (GF-25)."
