id = "BF-21"
name = "Lacunary 0–1 series"
definition = "Σ_{k ≥ 0} b^{−n_k} for a strictly increasing sequence of positive integers (n_k)_{k ≥ 0} with n_{k+1} − n_k → ∞, for example the Kempner–Fredholm number Σ_{k ≥ 0} 2^{−2^k}, Liouville's constant Σ_{k ≥ 1} 10^{−k!} and Σ_{k ≥ 1} b^{−k²}"
