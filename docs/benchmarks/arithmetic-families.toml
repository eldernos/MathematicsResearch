# Structured arithmetic families. Format: docs/benchmarks/SCHEMA.md.
# Identifiers are permanent; new families take the next free number.

[meta]
schema_version = 1
status_as_of = "Phase 22"

# ------------------------------------------------------------ Stoneham-type numbers

[[family]]
id = "BF-01"
name = "Stoneham numbers and their polynomial images"
definition = "α(b, c) = Σ_{j ≥ 1} 1/(c^j b^{c^j}) for coprime integers b ≥ 2 and c > 2, and P(α(b, c)) for every nonconstant polynomial P with rational coefficients"
radices_scope = "construction radix b"
full_normality = "proved_normal"
simple_normality = "proved_simply_normal"
disjunctivity = "proved_disjunctive"
discrepancy_status = "zero_normal"
barrier_status = "resolved"
evidence = "lean"
registry_ids = ["ST-01", "ST-05", "ST-08", "ST-11", "ST-18", "ST-28"]
external_sources = [
  "Stoneham 1973: normality of Stoneham numbers in the cases he treated",
  "Bailey–Crandall 2002: normality of α(b, c) for all coprime b, c ≥ 2",
]
summary = "Every nonconstant rational polynomial in α(b, c) is normal in the construction radix (ST-01 for odd prime powers c = p^e, ST-11 for every coprime c > 2). Distinct powers are jointly uniformly distributed (ST-05), and power-saving discrepancy bounds hold for odd-prime and coprime parameters (ST-18, ST-28)."
open_frontier = "Normality in any radix other than the construction radix (α(2, 3) in base 3 has only superlinear word complexity, ST-10); rational functions such as 1/α(b, c); polynomials in generators on different prime axes."

[[family]]
id = "BF-02"
name = "Parameter-two Stoneham polynomials"
definition = "P(α(b, 2)) with α(b, 2) = Σ_{j ≥ 1} 1/(2^j b^{2^j}), odd b ≥ 3, and P a nonconstant polynomial with rational coefficients"
radices_scope = "construction radix b"
full_normality = "partial"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "partial"
barrier_status = "no_barrier_recorded"
evidence = "lean+paper"
registry_ids = ["ST-12", "ST-13", "ST-19", "ST-20", "ST-23", "ST-31", "ST-33", "ST-34"]
external_sources = ["Bailey–Crandall 2002: normality of α(b, 2) for odd b"]
summary = "Normal: α(b, 2)² (ST-12), every polynomial of degree q^r for an odd prime q (ST-13), all quartics (ST-23), and every polynomial of degree 3 through 120, of degree 128, or in sixteen infinite cyclic-descent families (ST-31, ST-33). A rational quadratic image is normal exactly when its prefix-denominator sequence tends to infinity, and every rational quadratic image has D⁻ = 0, D⁺ ≤ 1/4 and logarithmic equidistribution (ST-20); exact plateau-cycle spectra are in ST-34."
open_frontier = "Normality of the X² − 2X image at any specified odd radix; nonvanishing of the leading mass M_d on [1, 2) for every degree d ≥ 3, including 2^r with r ≥ 8 and even multiples 2p^r > 120."

[[family]]
id = "BF-03"
name = "Mixed-prime Stoneham products"
definition = "α(b, c) α(b, d) for multiplicatively independent integers c, d ≥ 2 coprime to b, in particular α(B, p) α(B, q) for distinct odd primes p < q not dividing B"
radices_scope = "construction radix b"
full_normality = "open"
simple_normality = "open"
disjunctivity = "partial"
discrepancy_status = "strict_upper_bound"
barrier_status = "barrier_proved"
evidence = "paper"
registry_ids = ["ST-06", "ST-07", "ST-14", "ST-25", "ST-29", "ST-32", "ST-35"]
external_sources = ["Ridout 1957: restricted-denominator form of Roth's theorem"]
summary = "Every member is transcendental with D⁺ < 1 (ST-07, qualitative). For α(2, 3) α(2, 5): D⁻ = 0, logarithmic equidistribution and D⁺ ≤ 4/11 + 2.85 × 10⁻¹⁰, within 2.85 × 10⁻¹⁰ of the fixed-depth barrier 4/11 (ST-32). For every odd prime pair, infinitely many radices B give D⁻ = 0, logarithmic equidistribution and explicit D⁺ < 1 (ST-35). D⁻ = 0 implies disjunctivity."
open_frontier = "Full normality of any mixed-prime product; the zero-slack equivalence D⁺ ≤ 4/11 of ST-35; disjunctivity without D⁻ = 0."

[[family]]
id = "BF-04"
name = "Signed Stoneham shells"
definition = "X = Σ_{j ≥ 0} a_j/(p^j b^{p^j}) with a_0 = c_0, a_{j+1} = c_{j+1} − p c_j, for a prime p not dividing b and a bounded integer phase sequence (c_j)"
radices_scope = "construction radix b"
full_normality = "classified"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "classified"
barrier_status = "resolved"
evidence = "lean"
registry_ids = ["DS-01", "DS-02", "DS-03", "DS-04", "DS-05", "DS-06", "DS-07", "DS-11"]
external_sources = ["Ridout 1957: restricted-denominator form of Roth's theorem (transcendence in DS-07)"]
summary = "D_N − Z(N)/N → 0, where Z(N) counts the positions below N in zero-phase shells (DS-01); X is normal exactly when the phases are eventually nonzero (DS-06). The attainable limiting discrepancies are the values V_p(s) of suffix-maximal binary words (DS-04), a closed nowhere dense set of Hausdorff dimension log 2/log p (DS-11). Irrational members are transcendental (DS-07)."
open_frontier = "Digit statistics in radices other than b; simple normality and disjunctivity of the nonnormal members."

[[family]]
id = "BF-05"
name = "Finite combinations of Stoneham-type components"
definition = "F = Σ_{m ∈ M} a_m T_m for a finite set M of positive integers and rational a_m, with T_m = Σ_{j ≥ 0} 1/(m p^j b^{m p^j}) and p an odd prime not dividing b"
radices_scope = "construction radix b"
full_normality = "classified"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "partial"
barrier_status = "no_barrier_recorded"
evidence = "lean"
registry_ids = ["CR-01", "CR-02", "CR-03", "CR-04", "CR-05", "CR-06", "CR-07"]
external_sources = []
summary = "F is normal exactly when the d-th cyclotomic polynomial, d = ord_p(b), divides none of finitely many explicit rational polynomials (CR-01). The integer-scaled orbits {bⁿ L F} of resonant sums, with L an explicit integer, have explicit weak limits (1 − w) λ + w δ_0 along N = S p^k, and one sum can have two different limiting distributions (CR-04). Two positive normal numbers can have an irrational nonnormal sum in every base (CR-03)."
open_frontier = "Exact D⁺ and D⁻ of resonant sums along all prefix lengths; combinations across several primes."

# ---------------------------------------------------------- localized series and weights

[[family]]
id = "BF-06"
name = "Localized logarithms and polylogarithms"
definition = "X = Σ_{m ∈ M(P)} 1/(m^s b^m), where M(P) is the set of positive integers whose prime factors lie in a finite set P of primes, and s ≥ 1"
radices_scope = "construction radix b"
full_normality = "classified"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "classified"
barrier_status = "resolved"
evidence = "lean"
registry_ids = ["LS-01", "LS-02", "LS-03", "LS-04", "LS-05", "LS-06", "LS-07", "LS-08", "LS-09", "LS-10"]
external_sources = []
summary = "X is normal in base b if some prime of P does not divide b, and D_N → 1 otherwise (LS-01). Two-generator supports satisfy D_N ≤ A/log log N (LS-04); distinct orders are jointly uniformly distributed (LS-09); persistent failed regions are null (LS-03)."
open_frontier = "Estimates uniform in P (the unrestricted series for ln 2 is not covered; see BF-23); finite-depth termination of certificates beyond two-prime supports (LS-06, LS-07)."

[[family]]
id = "BF-07"
name = "Masked supports and polynomial weights"
definition = "x = Σ_{m ∈ M(S)} P(m)/(m^s b^m) for a finite prime set S and a rational polynomial P, together with its restrictions to masks of M(S) and its periodic reweightings"
radices_scope = "construction radix b"
full_normality = "partial"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "partial"
barrier_status = "no_barrier_recorded"
evidence = "lean"
registry_ids = ["MW-01", "MW-02", "MW-03", "MW-04", "MW-05", "MW-06", "MW-07", "MW-08", "MW-09", "MW-10"]
external_sources = []
summary = "On full supports, x is normal exactly when the order of vanishing of P at 0 is below s and some prime of S does not divide b; otherwise lim inf D_N ≥ 1/L for some L coprime to b, and lim sup D_N = 1 for integer P (MW-01). Explicit rational weights give D_N → 2/3 (MW-07); late-power masks and single-axis masks are classified (MW-02, MW-03)."
open_frontier = "Classification of masked supports with nonmonomial polynomial denominators."

# ---------------------------------------------------------- q-series and modular values

[[family]]
id = "BF-08"
name = "Powers of Euler's product"
definition = "E_b^r = ∏_{k ≥ 1} (1 − b^{−k})^r for integers b ≥ 2 and r ≥ 1"
radices_scope = "construction radix b"
full_normality = "partial"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "partial"
barrier_status = "barrier_proved"
evidence = "lean+paper"
registry_ids = ["GF-03", "GF-04", "GF-06", "GF-08", "GF-12", "GF-17", "GF-19", "GF-20", "GF-27"]
external_sources = [
  "Euler 1750 (published 1760): pentagonal number theorem",
  "Jacobi 1829: the cube of Euler's product",
  "Nesterenko 1996: transcendence of E_b, hence of every E_b^r",
  "Serre 1985: lacunarity of the even powers η^r for r ∈ {2, 4, 6, 8, 10, 14, 26}",
]
summary = "r = 1: E_b ∈ K_b with exact gap √(2/3) (log_b N)/√N, simply normal only for b = 2, never disjunctive (GF-03). r = 3: E_b³ ∈ K_b with exact gap √2 (log_b N)/√N, disjunctive, simply normal only for b = 2 (GF-04). Iterated derivatives D^j E_b, D^j E_b³ (j ≥ 1) and E_b² · DE_b are disjunctive, base-2 simply normal and not simply normal for b ≥ 3 (GF-19, GF-20). r = 2: E_b² ∈ K_b with exact radix-dependent constants of order (log log N)/(log N)^{3/4} (GF-04, GF-12), non-congruence prime sign rule x² + 36y² versus 4x² + 9y², and positive lower frequencies for both 0^L and (b − 1)^L (GF-20, GF-27). For r ≥ 4, coefficient transfer fails (GF-06), CM width W_U(N) ≍ N √(log N) blocks sparse and width transfers (GF-17), and the NAF entropy–multiplicity wall blocks signed-digit sparse transfers (GF-27)."
open_frontier = "Any distributional property of E_b^r for r ≥ 4; simple normality and disjunctivity of E_b²."

[[family]]
id = "BF-09"
name = "Rational scalings of Euler powers"
definition = "(a/d) E_b^r for r ∈ {1, 2, 3} and reduced a/d with d ≥ 2 coprime to b"
radices_scope = "construction radix b"
full_normality = "partial"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "partial"
barrier_status = "no_barrier_recorded"
evidence = "lean+paper"
registry_ids = ["GF-04", "GF-16", "GF-20", "GF-27"]
external_sources = []
summary = "D_N((a/d) E_b) and D_N((a/d) E_b³) converge without oscillation to exact rational limits in [1/d, 1) via finite residue automata with error O((log N)/√N) (GF-16); signed automata give exact rational word frequencies, prove (a/d) E_b is never disjunctive, and odd-order complement symmetry proves (a/d) E_2 and (a/d) E_2³ are base-2 simply normal whenever ord_d(2) is odd (GF-20). For odd b and odd a, D_N((a/2) E_b²) → 2/3, and completed uniform Selberg sieve GF-27 makes (a/d) E_b² ∉ K_b unconditional for all d ≥ 2 coprime to b (GF-16, GF-27)."
open_frontier = "The exact limit law of (a/d) E_b² for odd d > 1; simple normality when ord_d(2) is even or b ≥ 3; disjunctivity of (a/d) E_b² and (a/d) E_b³."

[[family]]
id = "BF-10"
name = "Normal reciprocals of kernel elements"
definition = "1/x for x = ∏_{k ≥ 1} (1 + ε_k b^{−m_k}), with signs ε_k ∈ {−1, +1} and an exponent sequence (m_k) admissible in the sense of GF-16"
radices_scope = "construction radix b"
full_normality = "classified"
simple_normality = "partial"
disjunctivity = "partial"
discrepancy_status = "partial"
barrier_status = "no_barrier_recorded"
evidence = "lean+paper"
registry_ids = ["GF-08", "GF-16", "GF-26"]
external_sources = []
summary = "Exact multiplicative-order period identities are kernel-verified for both signs (GF-26). With every ε_k = −1, x is irrational and deep in K_b while 1/x is normal along all N with improved balanced-multiplier rate at ω_k = D_{k−1} (GF-16, GF-26). In general 1/x is normal iff ε_k = −1 eventually, else lim sup D_N ≥ 1/2 with exact limits for periodic sign patterns; replacing 1 ± q by cyclotomic factors P_k(q) realizes every prescribed D⁺(1/x; b) = α ∈ [0, 1] with base-2 simple normality (GF-26). A radix-primary rational A/b^j has reciprocal in K_b iff its b-coprime part divides b − 1 (GF-08)."
open_frontier = "Closing the one-iterated-logarithm gap between the balanced-multiplier rate and the Koksma lower bound; relaxing D_{k−1} ∣ b^{m_k} − 1; reciprocals of other kernel elements, notably P_b = 1/E_b (BF-14)."

[[family]]
id = "BF-11"
name = "Binary quadratic-form theta values"
definition = "Θ_Q(1/b) = Σ_{(m, n) ∈ ℤ²} b^{−Q(m, n)} for a positive definite integral binary quadratic form Q"
radices_scope = "construction radix b"
