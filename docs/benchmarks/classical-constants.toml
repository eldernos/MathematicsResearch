discrepancy_summary = "No bound D⁺ < 1 is known in any base. The first N binary digits contain at least a constant times log N transitions, from the finite irrationality exponent μ(π) ≤ 7.1032, far below positive density."
registry_ids = ["CC-04", "CC-08", "CC-12", "SY-21", "SY-22", "SY-23", "CC-50", "GF-18"]
external_sources = [
  "Lambert 1761: π is irrational",
  "Lindemann 1882: π is transcendental",
  "Bailey–Borwein–Plouffe 1997: base-16 digit-extraction formula for π",
  "Zeilberger–Zudilin 2020: irrationality exponent μ(π) ≤ 7.1032",
]
control_provenance = {}
radix_results = []
notes = "BBP and Bellard prefixes have exact denominator rates 3/2 and 1 per binary shift (SY-21); Legendre rounding gives odd-denominator rational models with linear windows (SY-23). BBP extraction is position-local rather than low-denominator, and the window–denominator barrier applies (CC-50). Main open question: D⁺(π; b) < 1 in some base b."

[[constant]]
id = "BC-09"
name = "ln 2"
formula = "ln 2 = Σ_{n ≥ 1} 1/(n 2ⁿ) = 0.69314718…"
category = "logarithmic_and_pi"
cohort = "unresolved"
arithmetic_nature = "transcendental (Lindemann 1882)"
radices_scope = "all integer bases b ≥ 2"
full_normality = "open"
simple_normality = "open"
disjunctivity = "open"
discrepancy_status = "open"
digit_frequency_status = "open"
barrier_status = "barrier_proved"
evidence = "open"
discrepancy_summary = "No bound D⁺ < 1 is known in any base; the binary bound D⁺(ln 2) ≤ 0.9999 is open. The first N binary digits contain at least a constant times log N transitions (CC-05)."
registry_ids = ["CC-01", "CC-02", "CC-04", "CC-05", "CC-42", "CC-43", "CC-50", "OP-11", "OP-13", "GF-09", "GF-18", "GF-28", "GF-35", "GF-40", "GF-47"]
external_sources = [
  "Lindemann 1882: Hermite–Lindemann theorem; the logarithm of an algebraic number other than 0 and 1 is transcendental",
]
control_provenance = {}
radix_results = []
notes = "The denominator rate 1/2 is optimal among finite dyadic logarithm identities (CC-02); every balanced algebraic trace source has rate at least 5/12 (CC-43); the window–denominator barrier excludes the incomplete-orbit hypothesis at every positive denominator rate (CC-50); the actual Taylor prefixes have superpolynomial rational periods (OP-11); the logarithmic Euler-product representation collapses to the Taylor prefixes (GF-09); the badly-approximable K_2 barrier (GF-28) shows μ = 2 and bounded partial quotients cannot exclude K_2; GF-35 proves the exact BBP prime-band law (p ∣ Q_N iff p ∤ A_{⌊N/p⌋} for √N < p ≤ N), the kernel-verified Glaisher–Wieferich congruence p ∣ A_{p−1} iff p is Wieferich, and D⁺(x; 2) = 1 iff lim sup ∣S_N(1)∣ = 1; GF-40 proves the unconditional dropped-prime bound Σ_{p ∈ D_n} log p ≤ 4 n^{2/3}, top-band decomposition ln 2 = α_top + β_low, and two sharp joint-BBP barriers; and GF-47 extends the BBP band law all-p-adically, quantifies recurrence rigidity, and proves a geometric O(log N)-reset barrier. Normality of the logarithm restricted to finitely many primes (LS-01) does not pass to ln 2."

