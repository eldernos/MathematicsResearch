# ---------------------------------------------------------------- algebraic

[[constant]]
id = "BC-01"
name = "√2"
formula = "√2 = 1.41421356…, the positive root of x² − 2"
category = "algebraic"
cohort = "unresolved"
arithmetic_nature = "algebraic of degree 2"
radices_scope = "all integer bases b ≥ 2"
full_normality = "open"
simple_normality = "open"
disjunctivity = "open"
discrepancy_status = "open"
digit_frequency_status = "open"
barrier_status = "barrier_proved"
evidence = "open"
discrepancy_summary = "No bound D⁺ < 1 is known in any base. Among the first N binary digits at least a constant times √N are ones, which is still density zero."
registry_ids = ["CC-04", "CC-50", "GF-18", "GF-40", "GF-47"]
external_sources = [
  "Bailey–Borwein–Crandall–Pomerance 2004: an algebraic irrational of degree d has at least a constant times N^{1/d} ones among its first N binary digits",
  "Adamczewski–Bugeaud 2007: the subword complexity p(n) of an algebraic irrational in an integer base satisfies p(n)/n → ∞",
]
control_provenance = {}
radix_results = []
notes = "Main open question: binary D⁺(√2) < 1, which is equivalent to a positive lower density of binary digit transitions (CC-04). Closing the gap from density zero to positive density needs control of digit runs on a set of positive density; the window–denominator barrier applies (CC-50, GF-18), GF-40 establishes exact squaring carry lower bounds alongside signed-digit neutralization and exponential-carry deficit barriers, and GF-47 proves an exact signed-digit complexity equivalence σ ≤ χ."

