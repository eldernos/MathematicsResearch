<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">Exact denominator exponent landscape across multiple geometric scales</title>
<desc id="desc">Two step charts. The upper chart has a logarithmic horizontal axis of digit position n from 1 to 19683, with vertical lines at the powers of 3, and a vertical axis from 0 to 18 giving the exponent of 3 in the reduced denominator. The blue step line starts at 0, jumps to 2 at n = 6, 3 at 12 and 4 at 18, drops to 2 on the orange interval from 30 to 35, then rises by about two per power of 3 up to 16, staying inside a grey band between the lines 2 log base 3 of n minus 5 and 2 log base 3 of n. On each scale from 81 on, a narrow orange interval marks a dip of one. The lower chart enlarges the scale from 729 to 2187 on a linear axis: the exponent is 10 from 729, drops to 9 from 810 (orange), is 11 from 972 and 12 from 1458 up to 2187.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#7d8590" stroke-width="1.4"/></pattern></defs>
