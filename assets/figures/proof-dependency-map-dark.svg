<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 822" width="720" height="822" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">Proof-dependency map: which common mathematical techniques support the main theorems</title>
<desc id="desc">Node-link diagram in three columns. Left column, techniques: upper-orthant sums with K(p) congruent to 1 mod p minus 1; short-orbit cancellation on a fixed prime support; shell counting of signed phases; discrepancy of rational orbits; complete-orbit character sums; p-adic lift of cell coefficients; recurrence on the logarithmic circle; finite differences and finite-ray separation. Middle column, frameworks: rational-prefix normality certificate; discrepancy on selected positions; Ridout&#x27;s theorem as a paper input; insertion-cell model; the order-one joint-failure formula of Phase 10 as a historical node; persistent failed regions with exact discrepancy at all orders; polynomial masks. Right column, results ST-01, ST-05, DS-01, DS-03, DS-04, CR-01, LS-01, MW-01. Solid arrows: orthant sums and the certificate to ST-01, ST-01 to ST-05; short-orbit cancellation to the certificate, certificate to selected positions, which with shell counting feeds DS-01; DS-01 to DS-03 and DS-04; rational orbits to DS-03; orbit sums and p-adic lifts to the cell model, which feeds CR-01; recurrence, finite differences and persistent regions to LS-01; LS-01 and polynomial masks to MW-01. Dashed arrows: CR-01 to DS-01 and the order-one formula to persistent regions, both historical. A dotted arrow from Ridout&#x27;s theorem to DS-01. A band at the bottom states that all eight result modules import the definition of normality, Weyl&#x27;s criterion and the Fourier test.</desc>
