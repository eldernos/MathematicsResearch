<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" width="720" height="584" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">Finite-resolution visualization of the attainable discrepancy spectrum</title>
<desc id="desc">Top strip: a horizontal axis from 0 to 1 with a single aqua tick at 0 labelled normal and isolated, an empty stretch up to 2/3, and dense blue ticks between 2/3 and 1. Connector lines enlarge the interval from 2/3 to 1 into a lower panel with seven rows of blue rug ticks for period bounds L = 2, 4, 6, 8, 10, 12 and 14, containing 3, 8, 23, 71, 226, 747 and 2538 distinct values. The ticks fill in a Cantor-like pattern; a shaded band marks the empty gap between 3/4 and 8/9. Triangles mark the kernel-verified examples 27/40, 3/4 and 12/13.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#7d8590" stroke-width="1.4"/></pattern></defs>
